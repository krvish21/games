<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tap Race</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#0b0d17;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
[hidden]{display:none!important}
#menu{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
h1{margin:0;font-size:44px;font-style:italic;letter-spacing:2px;background:linear-gradient(90deg,#2ee6ff,#ff3b6b);-webkit-background-clip:text;color:transparent}
button,input{font:inherit;font-size:18px;border-radius:12px;border:0;padding:14px 22px}
button{background:linear-gradient(90deg,#2ee6ff,#4d7cff);color:#04101a;font-weight:800;width:240px}
input{background:#1b2033;color:#fff;width:240px;text-align:center;text-transform:uppercase;letter-spacing:6px}
#code{font-size:40px;font-weight:800;letter-spacing:10px;color:#ffd33d}
#st{color:#9aa3c7;min-height:22px;font-size:15px}
#game{height:100%;display:flex;flex-direction:column;position:relative}
#bar{display:flex;justify-content:space-between;padding:8px 16px;font-weight:700;color:#9aa3c7}
#bar b{color:#fff}
canvas{display:block;margin:0 auto}
#tap{flex:1;margin:8px 12px 12px;border-radius:22px;background:radial-gradient(circle at 50% 40%,#1d2547,#10142a);border:2px solid #2b3566;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:900;font-style:italic;color:#2b3566;position:relative;overflow:hidden;touch-action:none}
.rip{position:absolute;width:20px;height:20px;margin:-10px;border-radius:50%;border:3px solid #2ee6ff;animation:r .45s ease-out forwards;pointer-events:none}
@keyframes r{to{transform:scale(8);opacity:0}}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(5,7,15,.55);text-align:center;z-index:5}
#ov h2{margin:0;font-size:72px;font-style:italic;text-shadow:0 0 30px #2ee6ff}
#ov p{margin:0;color:#c8cff0}
</style></head><body>
<div id="menu">
  <h1>TAP RACE</h1>
  <button id="bc">Create race</button>
  <div style="color:#9aa3c7">or join a friend</div>
  <input id="inp" maxlength="4" placeholder="CODE">
  <button id="bj">Join race</button>
  <div id="code"></div>
  <div id="st"></div>
</div>
<div id="game" hidden>
  <div id="bar"><span>Position <b id="pos">1st</b></span><span><b id="dist">0</b> / 500 m</span></div>
  <canvas id="track"></canvas>
  <canvas id="gauge"></canvas>
  <div id="tap">TAP!</div>
  <div id="ov" hidden><h2 id="ot"></h2><p id="os"></p><button id="again" hidden>Race again</button></div>
</div>
<script>
const $=i=>document.getElementById(i),LEN=500,MAXS=260;
let peer,conn,host=false,state='menu',goT=0,last=0,streak=0,lastTap=0,aud,osc,myFin=false,dMe=0,dOp=0,acc=0;
const me={p:0,s:0,m:1},op={p:0,s:0,dp:0};
const tc=$('track'),tx=tc.getContext('2d'),gc=$('gauge'),gx=gc.getContext('2d');
let W=360;
function fit(c,w,h){const d=devicePixelRatio||1;c.width=w*d;c.height=h*d;c.style.width=w+'px';c.style.height=h+'px';c.getContext('2d').setTransform(d,0,0,d,0,0)}
function resize(){W=innerWidth;fit(tc,W,190);fit(gc,Math.min(W,300),150)}
addEventListener('resize',resize);
const msg=t=>$('st').textContent=t;
function ov(t,s,b){$('ov').hidden=!t;$('ot').textContent=t||'';$('os').textContent=s||'';$('again').hidden=!b}
function initAudio(){try{aud=aud||new (window.AudioContext||window.webkitAudioContext)();aud.resume()}catch(e){}}
function engine(on){if(!aud)return;if(on&&!osc){osc=aud.createOscillator();const g=aud.createGain();osc.type='sawtooth';g.gain.value=.03;osc.connect(g).connect(aud.destination);osc.start()}else if(!on&&osc){osc.stop();osc=null}}

function create(){
  initAudio();host=true;$('bc').hidden=$('bj').hidden=$('inp').hidden=true;
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ',code=Array.from({length:4},()=>A[Math.random()*24|0]).join('');
  peer=new Peer('tapr-'+code);
  peer.on('open',()=>{$('code').textContent=code;msg('Share this code. Waiting for opponent…')});
  peer.on('connection',c=>{if(conn)return;conn=c;c.on('open',()=>{link();setTimeout(()=>begin(false),1000)})});
  peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();create()}else msg('Error: '+e.type)});
}
function join(){
  initAudio();const code=$('inp').value.trim().toUpperCase();
  if(code.length<4)return msg('Enter the 4-letter code');
  msg('Connecting…');peer=new Peer();
  peer.on('open',()=>{conn=peer.connect('tapr-'+code,{reliable:true});conn.on('open',link)});
  peer.on('error',e=>msg(e.type==='peer-unavailable'?'Room not found':'Error: '+e.type));
}
function link(){
  conn.on('data',onData);
  conn.on('close',()=>{state='menu';engine(false);ov('Opponent left','Refresh to start a new race')});
  $('menu').hidden=true;$('game').hidden=false;resize();ov('Connected!','Get ready…');
}
function onData(d){
  if(d.t==='go')begin(true);
  else if(d.t==='ready'&&host)begin(false);
  else if(d.t==='s'){op.p=d.p;op.s=d.s}
  else if(d.t==='fin'&&state==='race')finish(false);
}
function begin(remote){
  me.p=me.s=0;me.m=1;op.p=op.s=op.dp=0;streak=0;myFin=false;dMe=dOp=0;
  state='count';goT=performance.now()+3200;ov('3','');
  if(host&&!remote)conn.send({t:'go'});
}
function finish(win){
  state='done';engine(false);
  if(win){myFin=true;conn.send({t:'fin'})}
  navigator.vibrate&&navigator.vibrate(win?[80,40,80,40,200]:200);
  ov(win?'🏁 YOU WIN!':'You lost 😬',host?'':'Waiting for host to restart…',host);
}
function tap(x,y){
  if(state!=='race')return;
  const n=performance.now();streak=n-lastTap<280?streak+1:0;lastTap=n;
  me.m=1+Math.min(streak,30)/30*.6;
  me.s=Math.min(MAXS,me.s+9*me.m);
  navigator.vibrate&&navigator.vibrate(6);
  const r=document.createElement('div');r.className='rip';r.style.left=x+'px';r.style.top=y+'px';
  $('tap').appendChild(r);r.onanimationend=()=>r.remove();
}
$('tap').addEventListener('pointerdown',e=>{e.preventDefault();const b=$('tap').getBoundingClientRect();tap(e.clientX-b.left,e.clientY-b.top)});
$('bc').onclick=create;$('bj').onclick=join;$('again').onclick=()=>{ov('');begin(false)};
function checkCarried(){
  try{
    const carried = (window.parent && window.parent !== window && window.parent.carriedConnection) || null;
    if(carried && carried.conn){
      initAudio();
      conn = carried.conn;
      host = !!carried.isHost;
      link();
      if(host){
        setTimeout(()=>begin(false), 800);
      }else{
        conn.send({t:'ready'});
      }
      return true;
    }
  }catch(e){}
  return false;
}
checkCarried();

function loop(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;
  if(state==='count'){
    const r=goT-t;
    if(r<=0){state='race';engine(true);ov('GO!','');setTimeout(()=>state==='race'&&ov(''),600)}
    else ov(r>2200?'3':r>1200?'2':'1','');
  }
  if(state==='race'){
    me.s-=me.s*.45*dt;if(me.s<.5)me.s=0;
    me.p+=me.s/3.6*dt;
    if(performance.now()-lastTap>280)streak=0,me.m=1;
    op.p=Math.min(LEN,op.p+op.s/3.6*dt);
    acc+=dt;if(acc>.05){acc=0;conn&&conn.open&&conn.send({t:'s',p:me.p,s:me.s})}
    if(osc)osc.frequency.value=50+me.s*1.6;
    if(me.p>=LEN){me.p=LEN;finish(true)}
  }
  op.dp+=(op.p-op.dp)*Math.min(1,dt*12);
  dMe+=me.s*dt*.6;dOp+=op.s*dt*.6;
  if(state!=='menu'){drawTrack();drawGauge();
    $('pos').textContent=me.p>=op.dp?'1st':'2nd';$('dist').textContent=Math.round(me.p)}
  requestAnimationFrame(loop);
}
function car(x,cy,col,spd){
  const c=tx;
  if(spd>110){c.fillStyle='#ff9d2e';c.beginPath();const l=Math.min(40,(spd-100)/4);c.moveTo(x,cy-5);c.lineTo(x-l,cy);c.lineTo(x,cy+5);c.fill()}
  c.fillStyle='#000';[[6,-17],[38,-17],[6,11],[38,11]].forEach(([a,b])=>c.fillRect(x+a,cy+b,14,6));
  c.fillStyle=col;c.beginPath();c.roundRect(x,cy-12,58,24,8);c.fill();
  c.fillStyle='rgba(255,255,255,.75)';c.fillRect(x+30,cy-8,12,16);
  c.fillStyle='#fff3a0';c.fillRect(x+55,cy-9,3,5);c.fillRect(x+55,cy+4,3,5);
}
function drawTrack(){
  const h=95,c=tx;c.clearRect(0,0,W,190);
  [[op.dp,op.s,dOp,'#ff3b6b','RIVAL'],[me.p,me.s,dMe,'#2ee6ff','YOU']].forEach(([p,s,d,col,nm],i)=>{
    const y=i*h;c.fillStyle=i?'#1b2033':'#171b2c';c.fillRect(0,y,W,h-3);
    c.fillStyle='rgba(255,255,255,.18)';const o=d%40;
    for(let k=-1;k<W/40+1;k++)c.fillRect(k*40-o,y+h/2+4,22,3);
    for(let k=0;k<6;k++){c.fillStyle=k%2?'#fff':'#111';c.fillRect(W-26,y+k*14,10,14)}
    c.fillStyle='rgba(255,255,255,.25)';c.fillRect(46,y,3,h-3);
    const x=14+(W-110)*Math.max(0,Math.min(1,p/LEN));
    car(x,y+h/2+4,col,s);
    c.fillStyle='#fff';c.font='bold 11px system-ui';c.fillText(nm+'  '+Math.round(s)+' km/h',x,y+16);
  });
}
function drawGauge(){
  const w=Math.min(W,300),x=gx;x.clearRect(0,0,w,150);
  const cx=w/2,cy=84,r=72,a0=.78*Math.PI,a1=2.22*Math.PI,f=me.s/MAXS,A=v=>a0+(a1-a0)*v;
  x.lineWidth=12;x.lineCap='round';x.strokeStyle='#222842';x.beginPath();x.arc(cx,cy,r,a0,a1);x.stroke();
  if(f>.01){const g=x.createLinearGradient(0,0,w,0);g.addColorStop(0,'#2ee6ff');g.addColorStop(.6,'#ffd33d');g.addColorStop(1,'#ff3b3b');
    x.strokeStyle=g;x.beginPath();x.arc(cx,cy,r,a0,A(f));x.stroke()}
  x.lineWidth=2;x.lineCap='butt';x.fillStyle='#9aa3c7';x.font='10px system-ui';x.textAlign='center';
  for(let i=0;i<=13;i++){const a=A(i/13),c=Math.cos(a),s=Math.sin(a);
    x.strokeStyle='#9aa3c7';x.beginPath();x.moveTo(cx+c*(r-12),cy+s*(r-12));x.lineTo(cx+c*(r-20),cy+s*(r-20));x.stroke();
    if(i%2===0)x.fillText(i*20,cx+c*(r-30),cy+s*(r-30)+3)}
  const a=A(f);x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(a)*(r-16),cy+Math.sin(a)*(r-16));x.stroke();
  x.fillStyle='#fff';x.beginPath();x.arc(cx,cy,6,0,7);x.fill();
  x.font='bold 30px system-ui';x.fillText(Math.round(me.s),cx,cy+36);
  x.font='11px system-ui';x.fillStyle='#9aa3c7';x.fillText('km/h',cx,cy+50);
  if(streak>3){x.fillStyle='#ffd33d';x.font='bold 14px system-ui';x.fillText('🔥 x'+me.m.toFixed(1)+' COMBO',cx,146)}
}
requestAnimationFrame(loop);
</script></body></html>
