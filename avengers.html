<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marvel Ludo: Infinity Gauntlet</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1020;color:#eef;font-family:system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:620px;padding:10px;text-align:center}
h1{color:#e23636;margin:8px 0}h2{margin:6px 0}
button,input,select{font:inherit;padding:10px 12px;border-radius:10px;border:0;margin:4px 0}
button{background:#e23636;color:#fff;font-weight:700;cursor:pointer;width:100%}
button:disabled{opacity:.35}
input,select{width:100%;background:#1b2038;color:#fff;text-align:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pc{background:#1b2038;border:2px solid #333b66;border-radius:10px;padding:5px;font-size:12px;cursor:pointer}
.pc.sel{border-color:#ffd23f}
.pc img{width:100%;height:86px;object-fit:cover;border-radius:6px;display:block;background:#000}
.pc small{display:block;opacity:.75;font-size:10px}
.win{color:#4cd964}.lose{color:#ff5a5a}.small{font-size:11px;opacity:.7}

/* top bar + panel */
.bar{display:flex;align-items:center;gap:6px;margin:6px 0}
.side{flex:1;background:#1b2038;border-radius:10px;padding:5px 8px;font-size:12px;border-bottom:3px solid}
.side .pname{font-weight:800;font-size:11px;letter-spacing:.5px;opacity:.9}
.side .pstones{font-size:17px;min-height:22px;letter-spacing:1px}
.side.right{text-align:right}
.turnpill{flex:1;font-weight:800;font-size:12px;background:#141830;border:1px solid #333b66;border-radius:10px;padding:8px 4px;color:#ffd23f}
.panel{background:#141830;border-radius:12px;padding:10px;margin:8px 0;min-height:70px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px}
.roll{font-size:20px;padding:14px;letter-spacing:1px;background:linear-gradient(90deg,#e23636,#f97316)}
.die{display:inline-flex;align-items:center;justify-content:center;width:60px;height:60px;border-radius:14px;background:#fff;color:#111;font-size:30px;font-weight:900;box-shadow:0 4px 0 #97a}
.mute{position:fixed;top:10px;right:10px;width:44px;height:44px;border-radius:50%;background:#1b2038;padding:0;font-size:18px;z-index:60}
.log{font-size:11px;text-align:left;background:#0f1326;border-radius:8px;padding:6px;min-height:36px;margin:6px 0;opacity:.9}
details.lg{font-size:11px;text-align:left;opacity:.85;margin-top:6px;background:#141830;border-radius:8px;padding:6px}
details.lg summary{cursor:pointer;font-weight:700}
details.lg div{margin:3px 0}

/* ---------- Ludo board ---------- */
.board{position:relative;width:100%;aspect-ratio:1;margin:8px auto;background:#e8ecf5;border-radius:14px;overflow:hidden;box-shadow:0 0 0 4px #333b66,0 8px 24px #0008}
.bgrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr)}
.cell{border:1px solid #cbd3e6;background:#f7f9ff;position:relative;display:flex;align-items:center;justify-content:center}
.cell.home-red{background:#e23636}
.cell.home-blue{background:#3b82f6}
.cell.home-green{background:#22c55e;opacity:.4}
.cell.home-yellow{background:#eab308;opacity:.4}
.cell.start-red{background:#ffc2c2}
.cell.start-blue{background:#c2d2ff}
.cell .ico{font-size:clamp(10px,2.5vw,20px);line-height:1}
.cell .star{color:#bb9a1e}
.yard{position:relative;border-radius:10px}
.yard.y0{background:#e23636}
.yard.y1{background:#3b82f6}
.yard.dim{background:#22c55e;opacity:.35}
.yard.dim.b{background:#eab308}
.ylbl{position:absolute;bottom:3%;left:0;right:0;font-weight:800;font-size:clamp(9px,1.9vw,14px);color:#fff;text-shadow:0 1px 3px #000}
.yin{position:absolute;inset:9%;display:grid;grid-template-columns:1fr 1fr;gap:7%;place-items:center}
.hpiece{position:relative;width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid rgba(0,0,0,.4);background:#000;transition:transform .12s}
.hpiece img{width:100%;height:100%;object-fit:cover;display:block}
.hnum{position:absolute;right:2px;bottom:1px;background:#000c;color:#fff;font-size:9px;line-height:1.5;padding:0 4px;border-radius:6px}
.hpiece.go{border-color:#ffd23f;box-shadow:0 0 12px #ffd23f;animation:pulse 1s infinite;cursor:pointer}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.center{display:flex;align-items:center;justify-content:center;font-size:clamp(16px,5vw,34px);
  background:conic-gradient(from 45deg,#e23636 0 25%,#22c55e 25% 50%,#eab308 50% 75%,#3b82f6 75% 100%)}
.center span{filter:drop-shadow(0 1px 2px #000a)}
.center.locked{filter:grayscale(.85) brightness(.8)}
.overlay{position:absolute;inset:0;pointer-events:none}
.tok{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;
  color:#fff;font-weight:800;border:2px solid #fff;box-shadow:0 1px 4px #000a;z-index:5;
  transition:left .1s linear,top .1s linear,transform .08s;will-change:left,top}
.tok img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.tok.hop{transform:scale(1.2)}
.tok.go{cursor:pointer;outline:2px solid #ffd23f;pointer-events:auto}

/* ---------- flash effects ---------- */
#fx{position:fixed;transform:translate(-50%,-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:9999}
.fx-msg{display:flex;align-items:center;gap:8px;font-weight:900;font-size:clamp(15px,4.2vw,26px);padding:7px 18px;border-radius:14px;color:#fff;
  background:rgba(10,13,24,.86);box-shadow:0 4px 18px #000c;white-space:nowrap;animation:fxpop 1.4s ease forwards;text-shadow:0 2px 6px #000}
.fx-msg .fi{font-size:1.2em}
.fx-msg.claim{background:linear-gradient(90deg,#7c3aed,#f59e0b)}
.fx-msg.capture{background:linear-gradient(90deg,#7f1d1d,#e23636)}
.fx-msg.steal{background:linear-gradient(90deg,#b45309,#fbbf24)}
.fx-msg.shield{background:linear-gradient(90deg,#0369a1,#22d3ee);color:#06283a;text-shadow:none}
.fx-msg.soul{background:linear-gradient(90deg,#b45309,#fb923c)}
.fx-msg.unlock{background:linear-gradient(90deg,#7c3aed,#22d3ee);color:#06283a;text-shadow:none}
.fx-msg.win{background:linear-gradient(90deg,#f59e0b,#fde047);color:#3a2a00;text-shadow:none;font-size:clamp(20px,6vw,36px)}
@keyframes fxpop{0%{opacity:0;transform:scale(.4)}13%{opacity:1;transform:scale(1.18)}26%{transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:translateY(-30px) scale(1)}}
.board.shake{animation:shake .42s}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-7px,4px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(5px,3px)}}
</style></head>
<body><div id="app"></div>
<script>
/* ---------- Infinity Gauntlet Ludo ----------
   Heroes race around a classic 52-tile Ludo track. A few Infinity Stones
   (rare) rest on the track; land exactly on one to claim it. Each stone
   is single-use and returns to the board once spent. The center gauntlet
   stays locked until the first stone is claimed or stolen; after that the
   first hero to finish a lap while its owner still holds a stone snaps.
   Move by tapping a hero piece in your own base. */
const PATH=[
 [6,1],[6,2],[6,3],[6,4],[6,5],
 [5,6],[4,6],[3,6],[2,6],[1,6],
 [0,6],[0,7],[0,8],
 [1,8],[2,8],[3,8],[4,8],[5,8],
 [6,9],[6,10],[6,11],[6,12],[6,13],
 [6,14],[7,14],[8,14],
 [8,13],[8,12],[8,11],[8,10],[8,9],
 [9,8],[10,8],[11,8],[12,8],[13,8],
 [14,8],[14,7],[14,6],
 [13,6],[12,6],[11,6],[10,6],[9,6],
 [8,5],[8,4],[8,3],[8,2],[8,1],
 [8,0],[7,0],[6,0]
];
const PATH_IDX={};PATH.forEach(([r,c],i)=>PATH_IDX[r+','+c]=i);
const NSP=PATH.length, START=[0,26], STONE_SPOTS=[3,11,19,28,36,44];
const SAFE=new Set([0,8,13,21,26,34,39,47]);
const MAX_STONES=3; /* only a few stones rest on the track at once */
const COL=['#e23636','#3b82f6'];
const STONES=[
 {id:'power',  name:'Power',   icon:'⚡', desc:'+1 to your next roll (then spent)'},
 {id:'space',  name:'Space',   icon:'🌌', desc:'block the next capture of a hero (then spent)'},
 {id:'time',   name:'Time',    icon:'⏳', desc:'roll a 6 to move again (then spent)'},
 {id:'mind',   name:'Mind',    icon:'🧠', desc:'reroll your die once (then spent)'},
 {id:'reality',name:'Reality', icon:'🔴', desc:'ignore the Soul Stone when you steal (then spent)'},
 {id:'soul',   name:'Soul',    icon:'🟠', desc:'block the next steal from your hoard (then spent)'},
];
const HERO_NAMES=['Iron Man','Thor','Hulk','Captain America','Black Widow','Hawkeye','Spider-Man','Wolverine','Black Panther','Doctor Strange','Scarlet Witch','Vision'];
const STATS=['intelligence','strength','speed','durability','power','combat'];
const API='https://cdn.jsdelivr.net/gh/akabab/superhero-api@0.3.0/api/all.json';
let peer,conn,me=0,G=null,sel=[],N=3,msg='';
let AC=null,muted=false,seenFx=0;
const app=document.getElementById('app');
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const r6=()=>1+Math.random()*6|0;
const posOf=(p,t)=>(START[p]+t.prog)%NSP;
const hasStone=(p,id)=>G&&G.stones.some(s=>s.id===id&&s.owner===p);
const countStones=p=>G.stones.filter(s=>s.owner===p).length;
const myTurn=()=>G&&G.phase==='play'&&G.turn===me;

/* ---------- connection ---------- */
function lobby(){
  app.innerHTML=`<h1>Marvel Ludo</h1><h2>Infinity Gauntlet</h2>
  <p class="small">Lap the Ludo track and land on rare Infinity Stones to claim them. The center gauntlet stays 🔒 locked until the first stone is claimed or stolen — then the first hero to finish a lap while still holding a stone performs the Snap.</p>
  <label class="small">Heroes (tokens) per player</label>
  <select id="n"><option>2</option><option selected>3</option><option>4</option></select>
  <button onclick="host()">Host a game</button><p>or join a friend</p>
  <input id="c" placeholder="ROOM CODE" maxlength="5"><button onclick="join()">Join game</button><p class="small">${msg}</p>`;
}
function host(){
  N=+document.getElementById('n').value;
  const code=Math.random().toString(36).slice(2,7).toUpperCase();
  me=0;peer=new Peer('mludo-'+code);
  app.innerHTML='<h1>Infinity Gauntlet</h1><p>Share this code:</p><h1 id="cd">…</h1><p class="small">Waiting for opponent…</p>';
  peer.on('open',()=>document.getElementById('cd').textContent=code);
  peer.on('error',e=>{msg='Error: '+e.type;lobby()});
  peer.on('connection',c=>{conn=c;c.on('open',startGame);
    c.on('data',d=>{if(!G)return;
      if(d.t==='pick')pickSq(1,d.ids);
      else if(d.t==='roll')rollDice(1);
      else if(d.t==='reroll')reroll(1);
      else if(d.t==='move')move(1,d.ti)});
    c.on('close',()=>{msg='Opponent left';G=null;lobby()})});
}
function join(){
  const c=document.getElementById('c').value.trim().toUpperCase();if(!c)return;
  me=1;peer=new Peer();app.innerHTML='<h1>Connecting…</h1>';
  peer.on('error',e=>{msg='Could not connect ('+e.type+')';lobby()});
  peer.on('open',()=>{conn=peer.connect('mludo-'+c);
    conn.on('data',d=>{if(d.t==='s'){G=d.g;draw()}});
    conn.on('close',()=>{msg='Host left';G=null;lobby()})});
}
function broadcast(){draw();if(conn)conn.send({t:'s',g:G})}

/* ---------- setup ---------- */
async function startGame(){
  app.innerHTML='<h1>Loading heroes…</h1>';
  try{
    const all=await(await fetch(API)).json();
    const roster=[];
    for(const n of HERO_NAMES){const h=all.find(x=>x.name===n);
      if(h&&STATS.every(s=>typeof h.powerstats[s]==='number'&&h.powerstats[s]>0))roster.push({n,img:h.images.md,s:h.powerstats})}
    G={phase:'pick',n:N,roster,sq:[null,null],log:[],turn:0,stones:[],board:{},tk:null,fx:[],fxN:0,homeOpen:false,win:null};
    broadcast();
  }catch(e){msg='Could not load hero data: '+e.message;lobby()}
}
function pickSq(p,ids){
  if(!G||G.phase!=='pick'||G.sq[p]||ids.length!==G.n||new Set(ids).size!==ids.length)return;
  G.sq[p]=ids.map(i=>G.roster[i]);
  if(G.sq[0]&&G.sq[1]){
    G.stones=STONES.map(s=>({...s,owner:null,space:null}));
    G.board={};G.homeOpen=false;G.win=null;
    placeStones();
    G.tk=G.sq.map(sq=>sq.map(h=>({n:h.n,img:h.img,prog:0})));
    G.phase='play';G.six=0;G.turn=0;G.roll=null;G.raw=null;G.used=0;G.rerolled=false;
    G.fx=[];G.fxN=0;seenFx=0;shown={};
    G.log=['Game on! Red goes first.'];
  }
  broadcast();
}

/* ---------- effects ---------- */
function emitFx(kind,text,icon){if(!G.fx)G.fx=[];G.fxN=(G.fxN||0)+1;G.fx.push({id:G.fxN,kind,text,icon});if(G.fx.length>10)G.fx.shift()}
function toggleMute(){muted=!muted;draw()}
function playSound(kind){
  if(muted||typeof window==='undefined')return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime;
    const beep=(f,st,dur,ty,vol,to)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';
      o.frequency.setValueAtTime(f,t+st);if(to)o.frequency.exponentialRampToValueAtTime(to,t+st+dur);
      g.gain.setValueAtTime(.0001,t+st);g.gain.exponentialRampToValueAtTime(vol||.14,t+st+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t+st+dur);o.connect(g);g.connect(AC.destination);o.start(t+st);o.stop(t+st+dur+.03)};
    if(kind==='roll'){beep(200,0,.05,'square',.08);beep(300,.05,.05,'square',.08)}
    else if(kind==='claim'){beep(523,0,.1,'triangle',.16);beep(784,.09,.14,'triangle',.16)}
    else if(kind==='capture'){beep(240,0,.32,'sawtooth',.2,70);beep(120,0,.36,'square',.12,50)}
    else if(kind==='steal'){beep(700,0,.1,'square',.14);beep(460,.11,.14,'square',.14)}
    else if(kind==='shield'){beep(320,0,.22,'sine',.13,640)}
    else if(kind==='soul'){beep(180,0,.4,'sine',.12,480)}
    else if(kind==='win'){[523,659,784,1047].forEach((f,i)=>beep(f,i*.12,.2,'triangle',.18))}
  }catch(e){}
}
function showFlash(f){
  playSound(f.kind);
  if(f.kind==='roll')return;
  if(typeof document==='undefined'||!document.querySelector)return;
  const board=document.querySelector('.board');if(!board)return;
  const r=board.getBoundingClientRect();
  let layer=document.getElementById('fx');
  if(!layer){layer=document.createElement('div');layer.id='fx';document.body.appendChild(layer)}
  layer.style.left=(r.left+r.width/2)+'px';
  layer.style.top=(r.top+r.height/2)+'px';
  const m=document.createElement('div');
  m.className='fx-msg '+(f.kind||'');
  m.innerHTML=(f.icon?`<span class="fi">${f.icon}</span>`:'')+(f.text||'');
  layer.appendChild(m);
  if(f.kind==='capture'||f.kind==='steal'){board.classList.add('shake');setTimeout(()=>board.classList.remove('shake'),430)}
  setTimeout(()=>m.remove(),1400);
}
function runFx(){
  if(!G||!G.fx||!G.fx.length)return;
  const max=G.fx[G.fx.length-1].id;
  const news=G.fx.filter(f=>f.id>seenFx);
  if(!news.length)return;
  seenFx=max;
  news.forEach((f,i)=>setTimeout(()=>{try{showFlash(f)}catch(e){}},i*320));
}

/* ---------- rules (host only) ---------- */
function rollDice(p){
  if(!G||G.phase!=='play'||G.turn!==p||G.roll!==null)return;
  G.raw=r6();G.roll=G.raw;
  if(hasStone(p,'power')){G.roll++;consumeStone(p,'power')}
  G.used=0;
  emitFx('roll',String(G.roll),'🎲');
  broadcast();
}
function reroll(p){
  if(!G||G.phase!=='play'||G.turn!==p||G.roll===null||G.used||G.rerolled||!hasStone(p,'mind'))return;
  consumeStone(p,'mind');
  G.rerolled=true;G.raw=r6();G.roll=G.raw;
  if(hasStone(p,'power')){G.roll++;consumeStone(p,'power')}
  emitFx('roll',String(G.roll),'🎲');
  broadcast();
}
function move(p,ti){
  if(!G||G.phase!=='play'||G.turn!==p||G.roll===null||G.used)return;
  const t=G.tk[p][ti];if(!t)return;
  const oldProg=t.prog;
  G.used=1;t.prog+=G.roll;
  const L=[`${t.n} moves ${G.roll}`];
  const pos=posOf(p,t);
  let captured=false;
  if(!SAFE.has(pos)){
    G.tk[1-p].forEach(f=>{
      if(posOf(1-p,f)===pos){
        if(hasStone(1-p,'space')){consumeStone(1-p,'space');L.push(`${f.n} is shielded by the Space Stone`);emitFx('shield',`${f.n} shielded`,'🌌')}
        else{f.prog=0;captured=true;L.push(`captures ${f.n}!`);emitFx('capture',`Captured ${f.n}!`,'⚔️')}
      }
    });
  }
  if(captured)captureReward(p,L);
  const st=G.board[pos];
  if(st&&st.owner===null){
    st.owner=p;st.space=null;rebuildBoard();
    L.push(`claims the ${st.name} Stone ${st.icon}`);emitFx('claim',`${st.name} Stone!`,st.icon);
    openHome();placeStones();
  }
  log(L.join(', '));
  if(G.homeOpen&&G.stones.some(s=>s.owner===p)&&Math.floor(t.prog/NSP)>Math.floor(oldProg/NSP)){
    G.phase='over';G.win=p;emitFx('win',`${p?'Blue':'Red'} SNAPS!`,'🧤');broadcast();return;
  }
  const extra=G.raw===6&&hasStone(p,'time')&&(G.six||0)<2;
  if(extra){G.six=(G.six||0)+1;consumeStone(p,'time')}
  if(extra)startTurn(p);else endTurn(p);
}
function captureReward(p,L){
  const rival=1-p,own=G.stones.filter(s=>s.owner===rival);
  if(!own.length)return;
  if(hasStone(rival,'soul')&&!hasStone(p,'reality')){consumeStone(rival,'soul');L.push('the Soul Stone protects their stones');emitFx('soul','Soul Stone protects','🟠');return}
  if(hasStone(p,'reality'))consumeStone(p,'reality');
  const s=steal(rival,p);
  if(s){L.push(`steals the ${s.name} Stone ${s.icon}`);emitFx('steal',`Stole ${s.name} Stone`,s.icon);openHome()}
}
function steal(from,to){
  const own=G.stones.filter(s=>s.owner===from);
  if(!own.length)return null;
  const s=own[Math.random()*own.length|0];s.owner=to;return s;
}
/* --- stone board: rare stones, single-use, replenish when spent --- */
function rebuildBoard(){G.board={};G.stones.forEach(s=>{if(s.owner===null&&s.space!==null)G.board[s.space]=s})}
function boardStones(){return G.stones.filter(s=>s.owner===null&&s.space!==null).length}
function placeStones(){
  for(let guard=0;guard<24&&boardStones()<MAX_STONES;guard++){
    const pool=G.stones.filter(s=>s.owner===null&&s.space===null);
    if(!pool.length)break;
    const used=new Set(G.stones.filter(s=>s.space!==null).map(s=>s.space));
    const free=STONE_SPOTS.filter(x=>!used.has(x));
    if(!free.length)break;
    pool[Math.random()*pool.length|0].space=free[Math.random()*free.length|0];
  }
  rebuildBoard();
}
function consumeStone(p,id){
  const s=G.stones.find(x=>x.id===id&&x.owner===p);
  if(!s)return;
  s.owner=null;s.space=null;placeStones();
}
function openHome(){if(G.homeOpen)return;G.homeOpen=true;emitFx('unlock','Gauntlet unlocked!','🔓')}
function startTurn(p){
  G.turn=p;G.roll=null;G.raw=null;G.used=0;G.rerolled=false;
  log(`Player ${p+1}'s turn`);broadcast();
}
function endTurn(p){G.six=0;startTurn(1-p)}
function log(s){G.log.push(s);G.log=G.log.slice(-6)}

/* ---------- UI ---------- */
function tog(i){
  if(sel.includes(i))sel=sel.filter(x=>x!==i);else if(sel.length<G.n)sel.push(i);
  draw();
}
function confirmPick(){
  if(me===0)pickSq(0,sel);
  else{conn.send({t:'pick',ids:sel});G.sq[1]=sel.map(i=>G.roster[i]);draw()}
}
function rollBtn(){if(!myTurn()||G.roll!==null)return;me===0?rollDice(0):conn.send({t:'roll'})}
function rerollBtn(){if(!myTurn()||G.roll===null||G.used||G.rerolled)return;me===0?reroll(0):conn.send({t:'reroll'})}
function tok(i){if(!myTurn()||G.roll===null||G.used)return;me===0?move(0,i):conn.send({t:'move',ti:i})}
function draw(){if(!G)return;if(G.phase==='pick')return drawPick();drawPlay();animatePieces();runFx()}

function drawPick(){
  if(G.sq[me]){app.innerHTML='<h2>Squad locked in ✅</h2><p>Waiting for opponent…</p>';return}
  app.innerHTML=`<h2>Choose ${G.n} hero${G.n>1?'es':''}</h2>
  <p class="small">Picked ${sel.length}/${G.n}. Your heroes are your pieces in your base.</p>
  <div class="grid">`+
  G.roster.map((c,i)=>`<div class="pc ${sel.includes(i)?'sel':''}" onclick="tog(${i})">
    <img src="${c.img}" alt=""><b>${c.n}</b>
    <small>STR ${c.s.strength} · SPD ${c.s.speed} · POW ${c.s.power}</small></div>`).join('')+
  `</div><button ${sel.length===G.n?'':'disabled'} onclick="confirmPick()">Lock in squad</button>`;
}

/* ---------- board ---------- */
function yardHeroes(p){
  const items=G.tk[p].map((t,i)=>{
    const go=p===me&&myTurn()&&G.roll!==null&&!G.used;
    return `<div class="hpiece ${go?'go':''}" ${go?`onclick="tok(${i})"`:''}>
      <img src="${t.img}" alt=""><span class="hnum">${posOf(p,t)}</span></div>`;
  }).join('');
  return `<div class="yin">${items}</div><div class="ylbl">${p?'BLUE':'RED'}</div>`;
}
function board(){
  let g='';
  g+=`<div class="yard y0" style="grid-area:1/1/7/7">${yardHeroes(0)}</div>`;
  g+=`<div class="yard dim" style="grid-area:1/10/7/16"></div>`;
  g+=`<div class="yard y1" style="grid-area:10/10/16/16">${yardHeroes(1)}</div>`;
  g+=`<div class="yard dim b" style="grid-area:10/1/16/7"></div>`;
  g+=`<div class="center ${G.homeOpen?'':'locked'}" style="grid-area:7/7/10/10"><span>${G.homeOpen?'🧤':'🔒'}</span></div>`;
  for(let r=0;r<15;r++)for(let c=0;c<15;c++){
    const inYard=(r<6&&c<6)||(r<6&&c>8)||(r>8&&c<6)||(r>8&&c>8);
    const inCenter=(r>=6&&r<=8&&c>=6&&c<=8);
    if(inYard||inCenter)continue;
    let cls='cell',style='';
    if(r===7&&c>=1&&c<=5)cls+=' home-red';
    else if(r===7&&c>=9&&c<=13)cls+=' home-blue';
    else if(c===7&&r>=1&&r<=5)cls+=' home-green';
    else if(c===7&&r>=9&&r<=13)cls+=' home-yellow';
    else if(r===6&&c===1)cls+=' start-red';
    else if(r===8&&c===13)cls+=' start-blue';
    else cls+=' track';
    const idx=PATH_IDX[r+','+c];
    let inner='';
    if(idx!==undefined){
      const st=G.board[idx];
      if(st){const oc=st.owner===null?'#ffd23f':COL[st.owner];style=`;box-shadow:inset 0 0 0 3px ${oc}`;inner=`<span class="ico">${st.icon}</span>`}
      else if(SAFE.has(idx))inner='<span class="ico star">★</span>';
    }
    g+=`<div class="${cls}" style="grid-row:${r+1};grid-column:${c+1}${style}">${inner}</div>`;
  }
  return `<div class="board"><div class="bgrid">${g}</div><div class="overlay">${tokens()}</div></div>`;
}
const CELL=100/15;
function tokenStyle(p,i,prog){
  const idx=((START[p]+prog)%NSP+NSP)%NSP,[r,c]=PATH[idx];
  const off=(i-(G.tk[p].length-1)/2)*0.22+(p?0.14:-0.14);
  return {left:(c+0.14+off*0.4)*CELL, top:(r+0.14+off*0.6)*CELL, w:CELL*0.72};
}
function tokens(){
  let h='';
  for(let p=0;p<2;p++)G.tk[p].forEach((t,i)=>{
    const s=tokenStyle(p,i,t.prog);
    const clickable=p===me&&myTurn()&&G.roll!==null&&!G.used;
    const bc=hasStone(p,'space')?'#8fe3ff':'#fff';
    h+=`<div class="tok ${clickable?'go':''}" data-k="${p}-${i}" style="left:${s.left}%;top:${s.top}%;width:${s.w}%;height:${s.w}%;background:${COL[p]};border-color:${bc}"
      ${clickable?`onclick="tok(${i})"`:''}><img src="${t.img}" alt=""></div>`;
  });
  return h;
}
let shown={};
function animatePieces(){
  if(!G||!G.tk)return;
  if(typeof document==='undefined'||!document.querySelector)return;
  for(let p=0;p<2;p++)G.tk[p].forEach((t,i)=>{
    const key=p+'-'+i, np=t.prog, op=shown[key];
    shown[key]=np;
    if(op===undefined||op===np)return;
    const el=document.querySelector('.tok[data-k="'+key+'"]');
    if(!el)return;
    const dest=prog=>{const s=tokenStyle(p,i,prog);el.style.left=s.left+'%';el.style.top=s.top+'%'};
    if(np>op&&np-op<=8){
      el.style.transition='none';dest(op);void el.offsetWidth;
      el.style.transition='left .1s linear,top .1s linear,transform .08s';
      let k=op;
      const tick=()=>{k++;dest(k);el.classList.add('hop');setTimeout(()=>el.classList.remove('hop'),80);if(k<np)setTimeout(tick,100)};
      setTimeout(tick,15);
    }else if(np<op){
      dest(op);
      el.style.transition='opacity .18s,transform .18s';
      el.style.opacity='0';el.style.transform='scale(.35)';
      setTimeout(()=>{
        dest(np);
        el.style.transition='none';
        el.style.opacity='1';el.style.transform='scale(1)';
        void el.offsetWidth;
        el.style.transition='left .12s,top .12s,transform .12s';
      },200);
    }
  });
}
function stoneIcons(p){
  const own=G.stones.filter(s=>s.owner===p);
  return own.length?own.map(s=>`<span title="${s.name}: ${s.desc}">${s.icon}</span>`).join(''):'<span class="small">—</span>';
}
function drawPlay(){
  const over=G.phase==='over';
  const pill=over?'GAME OVER':(myTurn()?'YOUR TURN':'WAITING…');
  let action;
  if(over)action=`<h2 class="${G.win===me?'win':'lose'}">${G.win===me?'SNAP! You win 🧤':'Defeat'}</h2><button onclick="location.reload()">Play again</button>`;
  else if(!myTurn())action=`<div class="small">Opponent is moving…</div>`;
  else if(G.roll===null)action=`<button class="roll" onclick="rollBtn()">🎲 ROLL</button>`;
  else action=`<div class="die">${G.roll}</div>
    <div class="small">${hasStone(me,'power')?'Power +1 · ':''}tap a hero in your base</div>
    ${G.homeOpen&&G.stones.some(s=>s.owner===me)?'<div class="small win">🧤 Gauntlet open — finish a lap to Snap!</div>':''}
    ${hasStone(me,'mind')&&!G.rerolled&&!G.used?'<button onclick="rerollBtn()">🧠 Reroll</button>':''}`;
  app.innerHTML=`
  <button class="mute" onclick="toggleMute()">${muted?'🔇':'🔊'}</button>
  <div class="bar">
    <div class="side" style="border-color:${COL[0]}"><div class="pname">RED</div><div class="pstones">${stoneIcons(0)}</div></div>
    <div class="turnpill">${pill}</div>
    <div class="side right" style="border-color:${COL[1]}"><div class="pname">BLUE</div><div class="pstones">${stoneIcons(1)}</div></div>
  </div>
  ${board()}
  <div class="panel">${action}</div>
  <div class="log">${G.log.slice(-3).join('<br>')}</div>
  <details class="lg"><summary>Stones &amp; rules</summary>
    ${STONES.map(s=>`<div>${s.icon} <b>${s.name}</b> – ${s.desc}</div>`).join('')}
    <div>★ safe tile (no captures) · rare stones are single-use: land exactly on one to claim it, and it replenishes on the track once spent · the center 🔒 unlocks when the first stone is claimed or stolen · then hold a stone and finish a lap to Snap · capture a rival to steal their stone</div>
  </details>`;
}
function checkCarried(){
  try{
    const carried = (window.parent && window.parent !== window && window.parent.carriedConnection) || null;
    if(carried && carried.conn){
      conn = carried.conn;
      if(carried.isHost){
        me = 0;
        conn.on('data', d => {
          if(!G) return;
          if(d.t==='pick') pickSq(1, d.ids);
          else if(d.t==='roll') rollDice(1);
          else if(d.t==='reroll') reroll(1);
          else if(d.t==='move') move(1, d.ti);
          else if(d.t==='ready') broadcast();
        });
        conn.on('close', () => { msg='Opponent left'; G=null; lobby(); });
        startGame();
      }else{
        me = 1;
        app.innerHTML='<h1>Connecting to game…</h1>';
        conn.on('data', d => { if(d.t==='s'){ G=d.g; draw(); } });
        conn.on('close', () => { msg='Host left'; G=null; lobby(); });
        conn.send({t:'ready'});
      }
      return true;
    }
  }catch(e){}
  return false;
}
if(!checkCarried()) lobby();
</script></body></html>
