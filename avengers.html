<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marvel Ludo</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1020;color:#eef;font-family:system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;padding:12px;text-align:center}
h1{color:#e23636;margin:8px 0}h2{margin:6px 0}
button,input,select{font:inherit;padding:10px 12px;border-radius:10px;border:0;margin:4px 0}
button{background:#e23636;color:#fff;font-weight:700;cursor:pointer;width:100%}
button:disabled{opacity:.35}button.on{outline:3px solid #ffd23f}
input,select{width:100%;background:#1b2038;color:#fff;text-align:center}
.row{display:flex;gap:6px}.row>*{flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pc{background:#1b2038;border:2px solid #333b66;border-radius:10px;padding:5px;font-size:12px;cursor:pointer}
.pc.sel{border-color:#ffd23f}
.pc img{width:100%;height:90px;object-fit:cover;border-radius:6px;display:block;background:#000}
.pc small{display:block;opacity:.75;font-size:10px}
.tk{display:flex;justify-content:space-between;align-items:center;text-align:left;font-size:13px;background:#1b2038;border-radius:8px;padding:8px;margin:4px 0;border-left:5px solid}
.tk.go{outline:2px solid #ffd23f}.tk.x{opacity:.35}
.dice button{font-size:26px;padding:8px}
.log{font-size:12px;text-align:left;background:#141830;border-radius:8px;padding:6px;min-height:70px;margin:6px 0}
.win{color:#4cd964}.lose{color:#ff5a5a}.small{font-size:11px;opacity:.65}
</style></head>
<body><div id="app"></div>
<script>
const KIT={'Iron Man':['atk'],'Thor':['atk'],'Hawkeye':['atk'],'Wolverine':['atk','regen'],'Captain America':['shield'],'Vision':['shield'],'Hulk':['trap','rage'],'Black Widow':['trap'],'Spider-Man':['trap'],'Black Panther':['boost','absorb'],'Doctor Strange':['boost'],'Scarlet Witch':['boost']};
const ICON={atk:'⚔️',shield:'🛡️',boost:'⏩',trap:'🕸️'};
const PASS={rage:'heals 10 when hurt',absorb:'+3 move when hurt',regen:'+6 HP each turn'};
const COL=['#e23636','#3b82f6'];
const STATS=['intelligence','strength','speed','durability','power','combat'];
const API='https://cdn.jsdelivr.net/gh/akabab/superhero-api@0.3.0/api/all.json';
let peer,conn,me=0,G=null,sel=[],selD=null,msg='';
const app=document.getElementById('app');
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const r6=()=>1+Math.random()*6|0;
const tile=(p,prog)=>(p*20+prog)%40;
const ok=t=>!t.dead&&!t.home&&!t.fz;

/* ---------- connection ---------- */
function lobby(){
  app.innerHTML=`<h1>Marvel Ludo</h1><p class="small">Race your heroes round the ring to the Gauntlet. Heroes' power tiles help you and hurt rivals.</p>
  <label class="small">Heroes (tokens) per player</label>
  <select id="n"><option>1</option><option selected>2</option><option>3</option><option>4</option></select>
  <button onclick="host()">Host a game</button><p>or join a friend</p>
  <input id="c" placeholder="ROOM CODE" maxlength="5"><button onclick="join()">Join game</button><p class="small">${msg}</p>`;
}
let N=2;
function host(){
  N=+document.getElementById('n').value;
  const code=Math.random().toString(36).slice(2,7).toUpperCase();
  me=0;peer=new Peer('mludo-'+code);
  app.innerHTML='<h1>Marvel Ludo</h1><p>Share this code:</p><h1 id="cd">…</h1><p class="small">Waiting for opponent…</p>';
  peer.on('open',()=>document.getElementById('cd').textContent=code);
  peer.on('error',e=>{msg='Error: '+e.type;lobby()});
  peer.on('connection',c=>{conn=c;c.on('open',startGame);
    c.on('data',d=>{if(d.t==='pick')pickSq(1,d.ids);if(d.t==='move')move(1,d.ti,d.di)});
    c.on('close',()=>{msg='Opponent left';G=null;lobby()})});
}
function join(){
  const c=document.getElementById('c').value.trim().toUpperCase();if(!c)return;
  me=1;peer=new Peer();app.innerHTML='<h1>Connecting…</h1>';
  peer.on('error',e=>{msg='Could not connect ('+e.type+')';lobby()});
  peer.on('open',()=>{conn=peer.connect('mludo-'+c);
    conn.on('data',d=>{if(d.t==='s'){G=d.g;draw()}});
    conn.on('close',()=>{msg='Host left';G=null;lobby()})});
}
function broadcast(){draw();conn.send({t:'s',g:G})}

/* ---------- rules (host only) ---------- */
async function startGame(){
  app.innerHTML='<h1>Loading heroes…</h1>';
  try{
    const all=await (await fetch(API)).json();
    const roster=[];
    for(const n in KIT){const h=all.find(x=>x.name===n);
      if(h&&STATS.every(s=>typeof h.powerstats[s]==='number'&&h.powerstats[s]>0))roster.push({n,img:h.images.md,s:h.powerstats,k:KIT[n]})}
    G={phase:'pick',n:N,roster,sq:[null,null],log:[],turn:0};
    broadcast();
  }catch(e){msg='Could not load hero data: '+e.message;lobby()}
}
function pickSq(p,ids){
  if(!G||G.phase!=='pick'||G.sq[p]||ids.length!==G.n||new Set(ids).size!==ids.length)return;
  G.sq[p]=ids.map(i=>G.roster[i]);
  if(G.sq[0]&&G.sq[1]){
    const b=Array(40).fill(null),free=shuffle([...Array(40).keys()].filter(i=>i%20));
    G.sq.forEach((sq,p)=>sq.forEach(h=>{for(let k=0;k<3;k++){const i=free.pop();b[i]={o:p,t:h.k[0],h:h.n,pw:h.s.power}}}));
    G.board=b;
    G.tk=G.sq.map(sq=>sq.map(h=>{const m=Math.round(40+h.s.durability*.8);return{n:h.n,s:h.s,k:h.k,hp:m,max:m,prog:0,home:0,dead:0,fz:0,sh:0,bonus:0}}));
    G.phase='play';G.log=['Game on! Red starts.'];startTurn(0);
  }
  broadcast();
}
function startTurn(p){
  G.turn=p;
  G.tk[p].forEach(t=>{if(t.k[1]==='regen'&&!t.dead)t.hp=Math.min(t.max,t.hp+6)});
  G.dice=[r6(),r6()];G.used=[0,0];
  if(!G.tk[p].some(ok)){log('Player '+(p+1)+' has no free hero – turn skipped');endTurn(p)}
}
function endTurn(p){G.tk[p].forEach(t=>t.fz=Math.max(0,t.fz-1));startTurn(1-p)}
function log(s){G.log.push(s);G.log=G.log.slice(-6)}
function hurt(t,d){
  if(t.sh){t.sh=0;return `${t.n}'s shield absorbs it`}
  t.hp-=d;
  if(t.hp<=0){t.dead=1;return `${t.n} takes ${d} and is KO'd!`}
  let x='';
  if(t.k[1]==='rage'){t.hp=Math.min(t.max,t.hp+10);x=' – RAGE! +10 HP'}
  if(t.k[1]==='absorb'){t.bonus=3;x=' – absorbed, +3 next move'}
  return `${t.n} takes ${d}${x}`;
}
function move(p,ti,di){
  if(!G||G.phase!=='play'||G.turn!==p||G.used[di])return;
  const t=G.tk[p][ti];if(!t||!ok(t))return;
  G.used[di]=1;
  const d=G.dice[di]+t.bonus;t.bonus=0;
  t.prog=Math.min(40,t.prog+d);
  const L=[`${t.n} moves ${d}`];
  if(t.prog>=40){t.home=1;L.push('reaches the Gauntlet! 🧤')}
  else{
    const pos=tile(p,t.prog);
    const e=G.tk[1-p].find(x=>!x.dead&&!x.home&&tile(1-p,x.prog)===pos&&pos%20);
    if(e){L.push('captures! '+hurt(e,Math.round(10+t.s.strength*.3)));if(!e.dead)e.prog=Math.max(0,e.prog-4)}
    const b=G.board[pos];
    if(b&&b.o!==p){
      if(b.t==='atk')L.push(`${b.h}'s ⚔️ tile: `+hurt(t,Math.round(12+b.pw*.25)));
      else if(b.t==='shield'&&t.sh){t.sh=0;L.push(`${b.h}'s 🛡️ tile strips the shield`)}
      else if(b.t==='boost'){t.prog=Math.max(0,t.prog-3);L.push(`${b.h}'s ⏩ tile throws it back 3`)}
      else if(b.t==='trap'){t.fz=2;L.push(`caught in ${b.h}'s 🕸️ – frozen next turn`)}
    }else if(b&&b.o===p){
      if(b.t==='shield'){t.sh=1;L.push('gains a 🛡️ shield')}
      else if(b.t==='boost'){t.prog=Math.min(40,t.prog+3);L.push('⏩ +3 boost');if(t.prog>=40){t.home=1;L.push('reaches the Gauntlet! 🧤')}}
    }
  }
  log(L.join(', '));
  if(G.tk[p].every(x=>x.dead)){G.phase='over';G.win=1-p}
  else if(G.tk[1-p].every(x=>x.dead)||G.tk[p].every(x=>x.dead||x.home)){G.phase='over';G.win=p}
  else if(!G.used.includes(0)||!G.tk[p].some(ok))endTurn(p);
  broadcast();
}

/* ---------- UI ---------- */
function myTurn(){return G.phase==='play'&&G.turn===me}
function tog(i){
  if(sel.includes(i))sel=sel.filter(x=>x!==i);else if(sel.length<G.n)sel.push(i);
  draw();
}
function confirmPick(){me===0?pickSq(0,sel):(conn.send({t:'pick',ids:sel}),G.sq[1]=[]);draw()}
function die(i){if(myTurn()&&!G.used[i]){selD=i;draw()}}
function tok(i){
  if(!myTurn()||selD===null||!ok(G.tk[me][i]))return;
  const d=selD;selD=null;
  me===0?move(0,i,d):conn.send({t:'move',ti:i,di:d});
}
function draw(){
  if(!G)return;
  if(G.phase==='pick')return drawPick();
  if(!myTurn()||(selD!==null&&G.used[selD]))selD=null;
  drawPlay();
}
function drawPick(){
  if(G.sq[me]){app.innerHTML='<h2>Squad locked in ✅</h2><p>Waiting for opponent…</p>';return}
  app.innerHTML=`<h2>Choose ${G.n} hero${G.n>1?'es':''}</h2><p class="small">Each hero adds 3 power tiles to the board. Picked ${sel.length}/${G.n}</p><div class="grid">`+
  G.roster.map((c,i)=>`<div class="pc ${sel.includes(i)?'sel':''}" onclick="tog(${i})"><img src="${c.img}" alt=""><b>${c.n}</b><small>${ICON[c.k[0]]} · HP ${Math.round(40+c.s.durability*.8)} · STR ${c.s.strength} · POW ${c.s.power}</small>${c.k[1]?`<small>${PASS[c.k[1]]}</small>`:''}</div>`).join('')+
  `</div><button ${sel.length===G.n?'':'disabled'} onclick="confirmPick()">Lock in squad</button>`;
}
function pt(i){const a=i/40*6.2832-1.5708;return[200+150*Math.cos(a),200+150*Math.sin(a)]}
function svg(){
  let s='<svg viewBox="0 0 400 400" width="100%"><circle cx="200" cy="200" r="150" fill="none" stroke="#333b66" stroke-width="2"/>';
  for(let i=0;i<40;i++){
    const[x,y]=pt(i),b=G.board[i];
    s+=`<circle cx="${x}" cy="${y}" r="11" fill="#141830" stroke="${b?COL[b.o]:i%20?'#333b66':'#ffd23f'}" stroke-width="2.5"/>`;
    if(b)s+=`<text x="${x}" y="${y+4}" font-size="11" text-anchor="middle">${ICON[b.t]}</text>`;
    else if(i%20==0)s+=`<text x="${x}" y="${y+4}" font-size="10" text-anchor="middle" fill="#ffd23f">S</text>`;
  }
  s+='<text x="200" y="195" font-size="40" text-anchor="middle">🧤</text><text x="200" y="225" font-size="13" text-anchor="middle" fill="#ffd23f">GAUNTLET</text>';
  G.tk.forEach((tt,p)=>tt.forEach((t,i)=>{
    if(t.dead||t.home)return;
    const[x,y]=pt(tile(p,t.prog));
    s+=`<circle cx="${x+(p?7:-7)}" cy="${y+(i-1.5)*5}" r="8" fill="${COL[p]}" stroke="#fff" stroke-width="${t.sh?3:1.5}"/><text x="${x+(p?7:-7)}" y="${y+(i-1.5)*5+4}" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">${t.n[0]}</text>`;
  }));
  return s+'</svg>';
}
function row(t,i,mine){
  const go=mine&&myTurn()&&selD!==null&&ok(t);
  const fl=(t.sh?'🛡️':'')+(t.fz?'🕸️':'')+(t.bonus?'⏩':'');
  return `<div class="tk ${go?'go':''} ${t.dead?'x':''}" style="border-color:${COL[mine?me:1-me]}" ${mine?`onclick="tok(${i})"`:''}>
  <span><b>${t.n}</b> ${fl}<br><small>${t.dead?'KO':t.home?'HOME 🧤':`HP ${t.hp}/${t.max} · ${t.prog}/40`}</small></span><span>${ICON[t.k[0]]}</span></div>`;
}
function drawPlay(){
  let panel;
  if(G.phase==='over')panel=`<h2 class="${G.win===me?'win':'lose'}">${G.win===me?'Victory! 🏆':'Defeat'}</h2><button onclick="location.reload()">Play again</button>`;
  else if(!myTurn())panel='<p>Opponent is moving…</p>';
  else panel=`<p><b>Your turn</b> – tap a die, then a hero</p><div class="row dice">${G.dice.map((v,i)=>`<button class="${selD===i?'on':''}" ${G.used[i]?'disabled':''} onclick="die(${i})">🎲 ${v}</button>`).join('')}</div>`;
  app.innerHTML=`<div class="small">You are <b style="color:${COL[me]}">${me?'Blue':'Red'}</b> · tile owner = border colour. Your tiles help you, theirs hurt you.</div>${svg()}
  <div class="log">${G.log.slice(-4).join('<br>')}</div>${panel}
  <div>${G.tk[me].map((t,i)=>row(t,i,1)).join('')}</div>
  <div class="small">Opponent</div><div>${G.tk[1-me].map((t,i)=>row(t,i,0)).join('')}</div>
  <p class="small">⚔️ damages rivals · 🛡️ shields you / strips rivals · ⏩ +3 you / −3 rivals · 🕸️ freezes rivals. Landing on a rival hits them (not on S tiles).</p>`;
}
lobby();
</script></body></html>
