<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marvel Ludo: Infinity Gauntlet</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d1020;color:#eef;font-family:system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:500px;padding:12px;text-align:center}
h1{color:#e23636;margin:8px 0}h2{margin:6px 0}
button,input,select{font:inherit;padding:10px 12px;border-radius:10px;border:0;margin:4px 0}
button{background:#e23636;color:#fff;font-weight:700;cursor:pointer;width:100%}
button:disabled{opacity:.35}button.on{outline:3px solid #ffd23f}
input,select{width:100%;background:#1b2038;color:#fff;text-align:center}
.row{display:flex;gap:6px}.row>*{flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pc{background:#1b2038;border:2px solid #333b66;border-radius:10px;padding:5px;font-size:12px;cursor:pointer}
.pc.sel{border-color:#ffd23f}
.pc img{width:100%;height:86px;object-fit:cover;border-radius:6px;display:block;background:#000}
.pc small{display:block;opacity:.75;font-size:10px}
.tk{display:flex;justify-content:space-between;align-items:center;text-align:left;font-size:13px;background:#1b2038;border-radius:8px;padding:6px 8px;margin:4px 0;border-left:5px solid}
.tk.go{outline:2px solid #ffd23f;cursor:pointer}
.tk img{width:30px;height:30px;border-radius:6px;object-fit:cover}
.tk small{display:block;opacity:.7;font-size:10px}
.dice{font-size:30px;margin:6px 0}
.log{font-size:12px;text-align:left;background:#141830;border-radius:8px;padding:6px;min-height:60px;margin:6px 0}
.hud{display:flex;gap:6px;margin:6px 0}
.ph{flex:1;background:#1b2038;border:2px solid;border-radius:8px;padding:6px;font-size:13px}
.ph .st{font-size:16px}
.win{color:#4cd964}.lose{color:#ff5a5a}.small{font-size:11px;opacity:.65}
.lg{font-size:11px;text-align:left;opacity:.8;margin-top:8px}
.lg div{margin:2px 0}
</style></head>
<body><div id="app"></div>
<script>
/* ---------- Infinity Gauntlet Ludo ----------
   Race hero tokens around a 24-space ring. Six stone spaces hold the
   Infinity Stones. Land on one to claim it; capture a rival to send
   them home and steal a stone. First to 4 stones performs the Snap. */
const NSP=24, START=[0,12], STONE_SPOTS=[2,6,10,14,18,22], SAFE=new Set([0,12]), TARGET=4;
const COL=['#e23636','#3b82f6'];
const STONES=[
 {id:'power',  name:'Power',   icon:'⚡', desc:'+1 to every die roll'},
 {id:'space',  name:'Space',   icon:'🌌', desc:'your heroes cannot be captured'},
 {id:'time',   name:'Time',    icon:'⏳', desc:'roll a 6 to move again'},
 {id:'mind',   name:'Mind',    icon:'🧠', desc:'reroll your die once per turn'},
 {id:'reality',name:'Reality', icon:'🔴', desc:'land on a rival stone to steal it'},
 {id:'soul',   name:'Soul',    icon:'🟠', desc:'your stones cannot be stolen'},
];
const HERO_NAMES=['Iron Man','Thor','Hulk','Captain America','Black Widow','Hawkeye','Spider-Man','Wolverine','Black Panther','Doctor Strange','Scarlet Witch','Vision'];
const STATS=['intelligence','strength','speed','durability','power','combat'];
const API='https://cdn.jsdelivr.net/gh/akabab/superhero-api@0.3.0/api/all.json';
let peer,conn,me=0,G=null,sel=[],N=3,msg='';
const app=document.getElementById('app');
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const r6=()=>1+Math.random()*6|0;
const posOf=(p,t)=>(START[p]+t.prog)%NSP;
const hasStone=(p,id)=>G&&G.stones.some(s=>s.id===id&&s.owner===p);
const countStones=p=>G.stones.filter(s=>s.owner===p).length;
const myTurn=()=>G&&G.phase==='play'&&G.turn===me;

/* ---------- connection ---------- */
function lobby(){
  app.innerHTML=`<h1>Marvel Ludo</h1><h2>Infinity Gauntlet</h2>
  <p class="small">Race your heroes around the ring, claim the six Infinity Stones, and be first to ${TARGET} to Snap. Capture rivals to send them home and steal their stones.</p>
  <label class="small">Heroes (tokens) per player</label>
  <select id="n"><option>2</option><option selected>3</option><option>4</option></select>
  <button onclick="host()">Host a game</button><p>or join a friend</p>
  <input id="c" placeholder="ROOM CODE" maxlength="5"><button onclick="join()">Join game</button><p class="small">${msg}</p>`;
}
function host(){
  N=+document.getElementById('n').value;
  const code=Math.random().toString(36).slice(2,7).toUpperCase();
  me=0;peer=new Peer('mludo-'+code);
  app.innerHTML='<h1>Infinity Gauntlet</h1><p>Share this code:</p><h1 id="cd">…</h1><p class="small">Waiting for opponent…</p>';
  peer.on('open',()=>document.getElementById('cd').textContent=code);
  peer.on('error',e=>{msg='Error: '+e.type;lobby()});
  peer.on('connection',c=>{conn=c;c.on('open',startGame);
    c.on('data',d=>{if(!G)return;
      if(d.t==='pick')pickSq(1,d.ids);
      else if(d.t==='roll')rollDice(1);
      else if(d.t==='reroll')reroll(1);
      else if(d.t==='move')move(1,d.ti)});
    c.on('close',()=>{msg='Opponent left';G=null;lobby()})});
}
function join(){
  const c=document.getElementById('c').value.trim().toUpperCase();if(!c)return;
  me=1;peer=new Peer();app.innerHTML='<h1>Connecting…</h1>';
  peer.on('error',e=>{msg='Could not connect ('+e.type+')';lobby()});
  peer.on('open',()=>{conn=peer.connect('mludo-'+c);
    conn.on('data',d=>{if(d.t==='s'){G=d.g;draw()}});
    conn.on('close',()=>{msg='Host left';G=null;lobby()})});
}
function broadcast(){draw();if(conn)conn.send({t:'s',g:G})}

/* ---------- setup ---------- */
async function startGame(){
  app.innerHTML='<h1>Loading heroes…</h1>';
  try{
    const all=await(await fetch(API)).json();
    const roster=[];
    for(const n of HERO_NAMES){const h=all.find(x=>x.name===n);
      if(h&&STATS.every(s=>typeof h.powerstats[s]==='number'&&h.powerstats[s]>0))roster.push({n,img:h.images.md,s:h.powerstats})}
    G={phase:'pick',n:N,roster,sq:[null,null],log:[],turn:0,stones:[],board:{},tk:null};
    broadcast();
  }catch(e){msg='Could not load hero data: '+e.message;lobby()}
}
function pickSq(p,ids){
  if(!G||G.phase!=='pick'||G.sq[p]||ids.length!==G.n||new Set(ids).size!==ids.length)return;
  G.sq[p]=ids.map(i=>G.roster[i]);
  if(G.sq[0]&&G.sq[1]){
    const spots=shuffle(STONE_SPOTS.slice());
    G.stones=STONES.map((s,i)=>({...s,owner:null,space:spots[i]}));
    G.board={};G.stones.forEach(s=>G.board[s.space]=s);
    G.tk=G.sq.map(sq=>sq.map(h=>({n:h.n,img:h.img,prog:0})));
    G.phase='play';G.six=0;G.turn=0;G.roll=null;G.raw=null;G.used=0;G.rerolled=false;
    G.log=['Game on! Red goes first.'];
  }
  broadcast();
}

/* ---------- rules (host only) ---------- */
function rollDice(p){
  if(!G||G.phase!=='play'||G.turn!==p||G.roll!==null)return;
  G.raw=r6();
  G.roll=G.raw+(hasStone(p,'power')?1:0);
  G.used=0;
  broadcast();
}
function reroll(p){
  if(!G||G.phase!=='play'||G.turn!==p||G.roll===null||G.used||G.rerolled||!hasStone(p,'mind'))return;
  G.rerolled=true;G.raw=r6();
  G.roll=G.raw+(hasStone(p,'power')?1:0);
  broadcast();
}
function move(p,ti){
  if(!G||G.phase!=='play'||G.turn!==p||G.roll===null||G.used)return;
  const t=G.tk[p][ti];if(!t)return;
  G.used=1;t.prog+=G.roll;
  const L=[`${t.n} moves ${G.roll}`];
  const pos=posOf(p,t);
  let captured=false;
  if(!SAFE.has(pos)){
    G.tk[1-p].forEach(f=>{
      if(posOf(1-p,f)===pos){
        if(hasStone(1-p,'space'))L.push(`${f.n} is shielded by the Space Stone`);
        else{f.prog=0;captured=true;L.push(`captures ${f.n}!`)}
      }
    });
  }
  if(captured){
    if(hasStone(1-p,'soul'))L.push('the Soul Stone protects their stones');
    else{const s=steal(1-p,p);if(s)L.push(`steals the ${s.name} Stone ${s.icon}`)}
  }
  const st=G.board[pos];
  if(st){
    if(st.owner===null){st.owner=p;L.push(`claims the ${st.name} Stone ${st.icon}`)}
    else if(st.owner===1-p&&hasStone(p,'reality')){st.owner=p;L.push(`Reality warps the ${st.name} Stone away ${st.icon}`)}
  }
  log(L.join(', '));
  if(countStones(p)>=TARGET){G.phase='over';G.win=p;broadcast();return}
  const extra=G.raw===6&&hasStone(p,'time')&&(G.six||0)<2;
  if(extra)G.six=(G.six||0)+1;
  if(extra)startTurn(p);else endTurn(p);
}
function steal(from,to){
  const own=G.stones.filter(s=>s.owner===from);
  if(!own.length)return null;
  const s=own[Math.random()*own.length|0];s.owner=to;return s;
}
function startTurn(p){
  G.turn=p;G.roll=null;G.raw=null;G.used=0;G.rerolled=false;
  log(`Player ${p+1}'s turn`);broadcast();
}
function endTurn(p){G.six=0;startTurn(1-p)}
function log(s){G.log.push(s);G.log=G.log.slice(-6)}

/* ---------- UI ---------- */
function tog(i){
  if(sel.includes(i))sel=sel.filter(x=>x!==i);else if(sel.length<G.n)sel.push(i);
  draw();
}
function confirmPick(){
  if(me===0)pickSq(0,sel);
  else{conn.send({t:'pick',ids:sel});G.sq[1]=sel.map(i=>G.roster[i]);draw()}
}
function rollBtn(){if(!myTurn()||G.roll!==null)return;me===0?rollDice(0):conn.send({t:'roll'})}
function rerollBtn(){if(!myTurn()||G.roll===null||G.used||G.rerolled)return;me===0?reroll(0):conn.send({t:'reroll'})}
function tok(i){if(!myTurn()||G.roll===null||G.used)return;me===0?move(0,i):conn.send({t:'move',ti:i})}
function draw(){if(!G)return;if(G.phase==='pick')return drawPick();drawPlay()}

function drawPick(){
  if(G.sq[me]){app.innerHTML='<h2>Squad locked in ✅</h2><p>Waiting for opponent…</p>';return}
  app.innerHTML=`<h2>Choose ${G.n} hero${G.n>1?'es':''}</h2>
  <p class="small">Picked ${sel.length}/${G.n}. Your heroes are your tokens on the ring.</p>
  <div class="grid">`+
  G.roster.map((c,i)=>`<div class="pc ${sel.includes(i)?'sel':''}" onclick="tog(${i})">
    <img src="${c.img}" alt=""><b>${c.n}</b>
    <small>STR ${c.s.strength} · SPD ${c.s.speed} · POW ${c.s.power}</small></div>`).join('')+
  `</div><button ${sel.length===G.n?'':'disabled'} onclick="confirmPick()">Lock in squad</button>`;
}
function pt(i){const a=i/NSP*6.2832-1.5708;return[200+150*Math.cos(a),200+150*Math.sin(a)]}
function svg(){
  let s='<svg viewBox="0 0 400 400" width="100%"><circle cx="200" cy="200" r="150" fill="none" stroke="#333b66" stroke-width="2"/>';
  for(let i=0;i<NSP;i++){
    const[x,y]=pt(i),st=G.board[i];
    let stroke=SAFE.has(i)?'#ffd23f':'#333b66',fill='#141830';
    if(st){fill='#0a0d18';stroke=st.owner===null?'#6b7399':COL[st.owner]}
    s+=`<circle cx="${x}" cy="${y}" r="13" fill="${fill}" stroke="${stroke}" stroke-width="3"/>`;
    if(st)s+=`<text x="${x}" y="${y+5}" font-size="13" text-anchor="middle">${st.icon}</text>`;
    else if(SAFE.has(i))s+=`<text x="${x}" y="${y+4}" font-size="11" text-anchor="middle" fill="#ffd23f">★</text>`;
  }
  const by={};
  G.tk.forEach((tt,p)=>tt.forEach((t,i)=>{const k=posOf(p,t);(by[k]=by[k]||[]).push({p,i,t})}));
  for(const k in by){
    const arr=by[k],[x,y]=pt(+k);
    arr.forEach((o,j)=>{
      const dx=(j-(arr.length-1)/2)*13;
      const shield=hasStone(o.p,'space');
      s+=`<circle cx="${x+dx}" cy="${y}" r="8" fill="${COL[o.p]}" stroke="${shield?'#8fe3ff':'#fff'}" stroke-width="${shield?3:1.5}"/>`;
      s+=`<text x="${x+dx}" y="${y+4}" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">${o.t.n[0]}</text>`;
    });
  }
  s+='<text x="200" y="188" font-size="34" text-anchor="middle">🧤</text>';
  s+=`<text x="200" y="212" font-size="12" text-anchor="middle" fill="#ffd23f">FIRST TO ${TARGET}</text>`;
  s+=`<text x="200" y="230" font-size="12" text-anchor="middle" fill="#9aa3cc">RED ${countStones(0)} · BLUE ${countStones(1)}</text>`;
  return s+'</svg>';
}
function stonesHud(p){
  const own=G.stones.filter(s=>s.owner===p);
  return own.length?own.map(s=>`<span title="${s.name}: ${s.desc}">${s.icon}</span>`).join(''):'<span class="small">— none —</span>';
}
function row(t,i,mine){
  const who=mine?me:1-me;
  const go=mine&&myTurn()&&G.roll!==null&&!G.used;
  return `<div class="tk ${go?'go':''}" style="border-color:${COL[who]}" ${go?`onclick="tok(${i})"`:''}>
    <img src="${t.img}" alt="">
    <span style="flex:1;margin-left:8px"><b>${t.n}</b><small>space ${posOf(who,t)}</small></span>
    ${hasStone(who,'space')?'<span title="Space Stone">🌌</span>':''}</div>`;
}
function drawPlay(){
  let panel;
  if(G.phase==='over')panel=`<h2 class="${G.win===me?'win':'lose'}">${G.win===me?'Snap! You win 🧤':'Defeat'}</h2><button onclick="location.reload()">Play again</button>`;
  else if(!myTurn())panel='<p>Opponent is moving…</p>';
  else if(G.roll===null)panel=`<p><b>Your turn</b> – roll the die</p><button onclick="rollBtn()">🎲 Roll</button>`;
  else{
    const mind=hasStone(me,'mind');
    panel=`<p><b>Your turn</b> – tap a hero to move</p><div class="dice">🎲 ${G.roll}${hasStone(me,'power')?' <span class="small">(+1 Power)</span>':''}</div>`+
      (mind&&!G.rerolled&&!G.used?`<button onclick="rerollBtn()">🧠 Reroll</button>`:'');
  }
  app.innerHTML=`
  <div class="small">You are <b style="color:${COL[me]}">${me?'Blue':'Red'}</b> · first to ${TARGET} Infinity Stones wins the Snap</div>
  <div class="hud">
    <div class="ph" style="border-color:${COL[0]}"><b>Red</b> <span class="st">${stonesHud(0)}</span></div>
    <div class="ph" style="border-color:${COL[1]}"><b>Blue</b> <span class="st">${stonesHud(1)}</span></div>
  </div>
  ${svg()}
  <div class="log">${G.log.slice(-4).join('<br>')}</div>
  ${panel}
  <div class="small">Your heroes</div>${G.tk[me].map((t,i)=>row(t,i,1)).join('')}
  <div class="small">Opponent</div>${G.tk[1-me].map((t,i)=>row(t,i,0)).join('')}
  <div class="lg">${STONES.map(s=>`<div>${s.icon} <b>${s.name}</b> – ${s.desc}</div>`).join('')}
  <div>★ safe start (no captures) · capture a rival to send them home and steal a stone</div></div>`;
}
lobby();
</script></body></html>
