<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14151a">
<title>QGam – Game Arcade</title>
<style>
  :root{
    --bg:#14151a; --card:#1f2128; --card2:#262933; --text:#f1f2f6; --muted:#9aa0b0; --accent:#6ea8ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -200px,#2a2f55 0%,var(--bg) 60%) fixed;
    color:var(--text);min-height:100vh;
    padding:max(20px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
  }
  header{max-width:900px;margin:0 auto 18px;text-align:center}
  h1{font-size:2rem;letter-spacing:.5px}
  h1 span{color:var(--accent)}
  header p{color:var(--muted);margin-top:6px;font-size:.95rem}
  .search{
    display:block;width:100%;max-width:900px;margin:0 auto 18px;
    padding:12px 16px;border-radius:14px;border:1px solid #333747;
    background:var(--card);color:var(--text);font-size:1rem;outline:none;
  }
  .search:focus{border-color:var(--accent)}
  .grid{
    max-width:900px;margin:0 auto;display:grid;gap:14px;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  }
  a.card{
    display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;
    background:linear-gradient(160deg,var(--card2),var(--card));
    border:1px solid #2f3340;border-radius:18px;padding:16px;
    transition:transform .15s,border-color .15s,box-shadow .15s;
    min-height:150px;
  }
  a.card:hover,a.card:focus-visible{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.4);outline:none}
  a.card:active{transform:scale(.97)}
  .icon{font-size:2.4rem;line-height:1}
  .title{font-weight:700;font-size:1.05rem;margin-top:4px}
  .desc{color:var(--muted);font-size:.82rem;line-height:1.35;flex:1}
  .tag{
    align-self:flex-start;font-size:.7rem;font-weight:600;padding:3px 9px;border-radius:99px;
    background:#2d3a5e;color:#b7d0ff;
  }
  .tag.multi{background:#3b2d5e;color:#d9c2ff}
  .empty{text-align:center;color:var(--muted);margin-top:30px;display:none}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:28px}
</style>
</head>
<body>
<header>
  <h1>🎮 <span>QGam</span> Arcade</h1>
  <p>Tap a card to play</p>
</header>

<input class="search" id="q" type="search" placeholder="Search games…" autocomplete="off">
<main class="grid" id="grid"></main>
<p class="empty" id="empty">No games found.</p>
<footer id="count"></footer>

<script>
  // To add a new game, just add a line here.
  const games = [
    {file:"arena.html",                  title:"Arena",                icon:"🔫", desc:"Shooting PvP showdown. Outgun your rival.",     tag:"Multiplayer", multi:true},
    {file:"avengers.html",               title:"Avengers Top Trumps",  icon:"🦸", desc:"Trump card battle with Avengers stats.",        tag:"2 Players"},
    {file:"marvel-duel.html",            title:"Marvel Duel",          icon:"⚡", desc:"Pick a hero and duel the AI.",                  tag:"vs AI"},
    {file:"dropfour.html",               title:"Drop Four",            icon:"🔴", desc:"Drop discs and connect four in a row.",         tag:"2 Players"},
    {file:"farm-defend.html",            title:"Farm Defend",          icon:"🌾", desc:"Grow crops, get weapons, defend your base.",    tag:"Solo"},
    {file:"kiket.html",                  title:"Cricket",              icon:"🏏", desc:"Time your tap and hit the ball.",               tag:"Solo"},
    {file:"ludo.html",                   title:"Ludo",                 icon:"🎲", desc:"Classic Ludo, pass and play.",                  tag:"Multiplayer", multi:true},
    {file:"mini-planet.html",            title:"Mini Planet",          icon:"🪐", desc:"Tiny world simulation to explore.",             tag:"Solo"},
    {file:"red-green-light.html",        title:"Red Light, Green Light",icon:"🚦", desc:"Move on green, freeze on red.",                tag:"Solo"},
    {file:"summit-rush.html",            title:"Summit Rush",          icon:"🏔️", desc:"Dice-roll race to the summit.",                 tag:"Solo"},
    {file:"summit-rush-multiplayer.html",title:"Summit Rush Online",   icon:"🧗", desc:"Tactical summit race with friends.",            tag:"Multiplayer", multi:true},
    {file:"tank-duel.html",              title:"Tank Duel",            icon:"🛡️", desc:"Outgun your opponent's tank.",                  tag:"2 Players"},
    {file:"taprace.html",                title:"Tap Race",             icon:"🏎️", desc:"Tap faster to win the race.",                   tag:"Multiplayer", multi:true},
    {file:"tictactoe.html",              title:"Tic Tac Toe",          icon:"❌", desc:"The classic X and O showdown.",                 tag:"2 Players"}
  ];

  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const count = document.getElementById('count');
  const q = document.getElementById('q');

  function render(list){
    grid.innerHTML = list.map(g => `
      <a class="card" href="${g.file}">
        <div class="icon">${g.icon}</div>
        <div class="title">${g.title}</div>
        <div class="desc">${g.desc}</div>
        <span class="tag ${g.multi ? 'multi' : ''}">${g.tag}</span>
      </a>`).join('');
    empty.style.display = list.length ? 'none' : 'block';
    count.textContent = games.length + ' games';
  }

  q.addEventListener('input', () => {
    const s = q.value.trim().toLowerCase();
    render(games.filter(g => (g.title + ' ' + g.desc + ' ' + g.tag).toLowerCase().includes(s)));
  });

  render(games);
</script>
</body>
</html>
