<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Arena Duel</title>
<style>
*{box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#0b0f1a;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center}
canvas{background:#131a2b;max-width:100%;max-height:calc(100dvh - 150px);aspect-ratio:3/5;flex:0 1 auto}
#ctl{height:150px;width:100%;max-width:500px;position:relative;flex:none}
#joy{position:absolute;left:14px;bottom:10px;width:130px;height:130px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff33}
#knob{position:absolute;left:43px;top:43px;width:40px;height:40px;border-radius:50%;background:#7cf;opacity:.8;pointer-events:none}
.b{position:absolute;border-radius:50%;border:2px solid #fff4;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
#fire{right:14px;bottom:14px;width:92px;height:92px;background:#e5484d88}
#dash{right:116px;bottom:10px;width:64px;height:64px;background:#3b82f688}
#shd{right:116px;bottom:80px;width:64px;height:64px;background:#22c55e88}
.b.on{filter:brightness(1.6)}
#menu{position:fixed;inset:0;background:#0b0f1af2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
h1{margin:0 0 8px;letter-spacing:3px}
button,input{font:inherit;padding:12px 20px;border-radius:10px;border:0;min-width:210px}
button{background:#3b82f6;color:#fff;font-weight:700}
input{text-align:center;background:#1e293b;color:#fff;letter-spacing:4px}
#st{white-space:pre-line;color:#9ca3af;min-height:2.6em}
</style></head><body>
<canvas id="cv"></canvas>
<div id="ctl"><div id="joy"><div id="knob"></div></div>
<div class="b" id="shd">SHIELD</div><div class="b" id="dash">DASH</div><div class="b" id="fire">FIRE</div></div>
<div id="menu"><h1>ARENA DUEL</h1>
<button onclick="startMode('ai')">Play vs AI</button>
<button onclick="create()">Create room</button>
<input id="code" placeholder="CODE" maxlength="4" inputmode="numeric">
<button onclick="join()">Join room</button>
<p id="st">Shoot, dash and shield. Shield just before a hit to reflect it!</p></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const W=360,H=600,R=14,$=id=>document.getElementById(id),cv=$('cv'),g=cv.getContext('2d');
cv.width=W;cv.height=H;
const walls=[[130,285,100,30],[40,180,60,24],[260,396,60,24],[40,390,24,60],[296,150,24,60]];
let mode='menu',S=null,peer,conn,flip=false,inp1={x:0,y:0,f:0,d:0,s:0},inp0=inp1,ev=[],evAll=[],frame=0,last=0;
const st=t=>$('st').textContent=t;
function mk(x,y){return{x,y,hp:3,en:100,sh:0,shT:0,inv:0,fc:0,tri:0,spd:0,dash:-1,dx:0,dy:0}}
function newGame(){S={p:[mk(180,540),mk(180,60)],b:[],k:[],over:-1,t:0,kt:3}}
function hitW(p){return walls.some(w=>p.x>w[0]-R&&p.x<w[0]+w[2]+R&&p.y>w[1]-R&&p.y<w[1]+w[3]+R)}
function mv(p,dx,dy){p.x+=dx;if(hitW(p))p.x-=dx;p.y+=dy;if(hitW(p))p.y-=dy;p.x=Math.max(R,Math.min(W-R,p.x));p.y=Math.max(R,Math.min(H-R,p.y))}
// ---- AI ----
let ai={t:0,dir:1,sh:0};
function aiInput(dt){const p=S.p[1],o=S.p[0],n={x:0,y:0,f:0,d:0,s:0};
 ai.t-=dt;if(ai.t<=0){ai.t=.6+Math.random()*.8;ai.dir=Math.random()<.5?-1:1}
 const dx=o.x-p.x,dy=o.y-p.y,d=Math.hypot(dx,dy)||1,fw=d>220?1:d<130?-1:0;
 n.x=dx/d*fw-dy/d*ai.dir*.9;n.y=dy/d*fw+dx/d*ai.dir*.9;
 for(const b of S.b){if(b.o==1)continue;const rx=p.x-b.x,ry=p.y-b.y,bd=Math.hypot(rx,ry)||1,sp=Math.hypot(b.vx,b.vy)||1;
  if((rx*b.vx+ry*b.vy)/(bd*sp)>.9&&bd<110){
   if(bd<50&&p.en>20&&Math.random()<.35)ai.sh=.3;
   else if(p.en>=30&&Math.random()<.04)n.d=1;
   else{n.x+=-b.vy/sp;n.y+=b.vx/sp}}}
 ai.sh-=dt;n.s=ai.sh>0?1:0;
 n.f=Math.random()<.08?1:0;
 const l=Math.hypot(n.x,n.y);if(l>1){n.x/=l;n.y/=l}
 return n}
// ---- simulation (host / AI) ----
function step(dt){
 if(S.over>=0)return;S.t+=dt;
 const ins=[inp0,mode=='ai'?aiInput(dt):inp1];
 for(let i=0;i<2;i++){const p=S.p[i],o=S.p[1-i],n=ins[i];
  p.fc-=dt;p.inv-=dt;p.tri-=dt;p.spd-=dt;p.dash-=dt;
  if(n.s&&p.en>1){if(!p.sh)p.shT=0;p.sh=1;p.shT+=dt;p.en=Math.max(0,p.en-35*dt)}else{p.sh=0;p.en=Math.min(100,p.en+18*dt)}
  if(n.d&&p.dash<=-.3&&p.en>=30){p.en-=30;p.dash=.15;p.inv=.25;const l=Math.hypot(n.x,n.y);
   if(l<.1){const a=Math.atan2(o.y-p.y,o.x-p.x);p.dx=-Math.sin(a);p.dy=Math.cos(a)}else{p.dx=n.x/l;p.dy=n.y/l}ev.push('d')}
  let vx,vy;
  if(p.dash>0){vx=p.dx*520;vy=p.dy*520}else{const sp=(p.spd>0?190:130)*(p.sh?.5:1);vx=n.x*sp;vy=n.y*sp}
  mv(p,vx*dt,vy*dt);
  if(n.f&&p.fc<=0&&!p.sh){p.fc=.45;const a=Math.atan2(o.y-p.y,o.x-p.x);
   for(const d of p.tri>0?[-.25,0,.25]:[0])S.b.push({x:p.x,y:p.y,vx:Math.cos(a+d)*260,vy:Math.sin(a+d)*260,o:i});ev.push('f')}}
 for(const b of S.b){b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.x<0||b.x>W||b.y<0||b.y>H||walls.some(w=>b.x>w[0]&&b.x<w[0]+w[2]&&b.y>w[1]&&b.y<w[1]+w[3])){b.dead=1;continue}
  const t=S.p[1-b.o];
  if(Math.hypot(b.x-t.x,b.y-t.y)<R+4){
   if(t.sh){if(t.shT<.25){b.o=1-b.o;b.vx*=-1.2;b.vy*=-1.2;ev.push('p')}else{b.dead=1;ev.push('b')}}
   else if(t.inv<=0){b.dead=1;t.hp--;t.inv=.8;ev.push('h');if(t.hp<=0)S.over=b.o}}}
 S.b=S.b.filter(b=>!b.dead);
 S.kt-=dt;
 if(S.kt<=0&&S.k.length<2){S.kt=6;const q={x:0,y:0};do{q.x=30+Math.random()*300;q.y=60+Math.random()*480}while(hitW(q));S.k.push({x:q.x,y:q.y,t:'TSH'[Math.random()*3|0]})}
 for(const p of S.p)for(const k of S.k)if(Math.hypot(p.x-k.x,p.y-k.y)<R+10){k.dead=1;ev.push('k');if(k.t=='T')p.tri=8;else if(k.t=='S')p.spd=8;else p.hp=Math.min(3,p.hp+1)}
 S.k=S.k.filter(k=>!k.dead)}
function pack(){return{p:S.p.map(p=>({x:p.x,y:p.y,hp:p.hp,en:p.en,sh:p.sh,inv:p.inv,tri:p.tri,spd:p.spd})),b:S.b.map(b=>({x:b.x,y:b.y,o:b.o})),k:S.k,over:S.over,ev:evAll.splice(0)}}
// ---- sound ----
let ac;
function snd(t){try{ac=ac||new AudioContext();const m={f:[500,.08,'square'],h:[120,.25,'sawtooth'],p:[900,.2,'triangle'],b:[250,.1,'square'],d:[300,.12,'sine'],k:[800,.15,'triangle']}[t];
 const o=ac.createOscillator(),gn=ac.createGain();o.type=m[2];o.frequency.value=m[0];gn.gain.setValueAtTime(.08,ac.currentTime);gn.gain.exponentialRampToValueAtTime(.001,ac.currentTime+m[1]);
 o.connect(gn).connect(ac.destination);o.start();o.stop(ac.currentTime+m[1])}catch(e){}}
function playEv(l){l.forEach(snd);if(l.includes('h')&&navigator.vibrate)navigator.vibrate(60)}
// ---- input ----
const K={};onkeydown=e=>K[e.key.toLowerCase()]=1;onkeyup=e=>K[e.key.toLowerCase()]=0;
let J={x:0,y:0},B={f:0,d:0,s:0},jd=false;
function readInput(){let x=J.x+(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0),y=J.y+(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0);
 const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}
 return{x,y,f:+!!(B.f||K.j||K[' ']),d:+!!(B.d||K.k||K.shift),s:+!!(B.s||K.l)}}
const joy=$('joy'),knob=$('knob');
function jm(e){const r=joy.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);
 const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}J.x=Math.abs(x)<.15?0:x;J.y=Math.abs(y)<.15?0:y;knob.style.transform=`translate(${x*40}px,${y*40}px)`}
joy.onpointerdown=e=>{jd=true;joy.setPointerCapture(e.pointerId);jm(e)};
joy.onpointermove=e=>{if(jd)jm(e)};
joy.onpointerup=joy.onpointercancel=()=>{jd=false;J.x=J.y=0;knob.style.transform=''};
for(const[id,k]of[['fire','f'],['dash','d'],['shd','s']]){const el=$(id);
 el.onpointerdown=()=>{B[k]=1;el.classList.add('on')};
 el.onpointerup=el.onpointercancel=el.onpointerleave=()=>{B[k]=0;el.classList.remove('on')}}
cv.onpointerdown=()=>{if(S&&S.over>=0){mode=='guest'?conn.send({r:1}):newGame()}};
// ---- networking ----
function startMode(m){mode=m;flip=m=='guest';$('menu').style.display='none';evAll=[];if(m!='guest')newGame()}
function menu(){mode='menu';S=null;$('menu').style.display='flex'}
function create(){const c=1000+Math.random()*9000|0;st('Creating room…');if(peer)peer.destroy();
 peer=new Peer('arenaduel-'+c);
 peer.on('open',()=>st('Room code: '+c+'\nWaiting for your friend…'));
 peer.on('error',e=>{if(e.type=='unavailable-id')create();else st('Error: '+e.type)});
 peer.on('connection',cn=>{conn=cn;
  cn.on('open',()=>startMode('host'));
  cn.on('data',d=>{if(d.i)inp1=d.i;if(d.r&&S&&S.over>=0)newGame()});
  cn.on('close',()=>{st('Friend left.');menu()})})}
function join(){const c=$('code').value.trim();if(c.length<4)return st('Enter the 4-digit code');
 st('Connecting…');if(peer)peer.destroy();peer=new Peer();
 peer.on('error',e=>st('Could not connect ('+e.type+')'));
 peer.on('open',()=>{conn=peer.connect('arenaduel-'+c);
  conn.on('open',()=>startMode('guest'));
  conn.on('data',d=>{S=d;playEv(d.ev)});
  conn.on('close',()=>{st('Disconnected.');menu()})})}
// ---- draw ----
function draw(){g.clearRect(0,0,W,H);if(!S)return;const me=flip?1:0;
 g.save();if(flip){g.translate(W,H);g.rotate(Math.PI)}
 g.fillStyle='#334155';walls.forEach(w=>g.fillRect(w[0],w[1],w[2],w[3]));
 g.font='bold 11px sans-serif';g.textAlign='center';
 for(const k of S.k){g.fillStyle={T:'#facc15',S:'#22d3ee',H:'#f472b6'}[k.t];g.beginPath();g.arc(k.x,k.y,10,0,7);g.fill();
  g.save();g.translate(k.x,k.y);if(flip)g.rotate(Math.PI);g.fillStyle='#000';g.fillText(k.t,0,4);g.restore()}
 for(const b of S.b){g.fillStyle=b.o==me?'#7dd3fc':'#fca5a5';g.beginPath();g.arc(b.x,b.y,4,0,7);g.fill()}
 S.p.forEach((p,i)=>{const o=S.p[1-i];if(p.inv>0&&(p.inv*20|0)%2)g.globalAlpha=.4;
  g.fillStyle=i==me?'#38bdf8':'#f87171';g.beginPath();g.arc(p.x,p.y,R,0,7);g.fill();
  const a=Math.atan2(o.y-p.y,o.x-p.x);g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x+Math.cos(a)*(R+6),p.y+Math.sin(a)*(R+6));g.stroke();
  if(p.sh){g.strokeStyle='#4ade80';g.beginPath();g.arc(p.x,p.y,R+6,0,7);g.stroke()}g.globalAlpha=1});
 g.restore();
 [[me,H-8,'#38bdf8'],[1-me,22,'#f87171']].forEach(([i,y,c])=>{const p=S.p[i];g.textAlign='left';g.font='16px sans-serif';g.fillStyle=c;
  g.fillText('♥'.repeat(Math.max(0,p.hp))+(p.tri>0?'  3x':'')+(p.spd>0?'  ⚡':''),8,y);
  g.fillStyle='#ffffff22';g.fillRect(W-108,y-10,100,8);g.fillStyle=p.en<30?'#facc15':'#4ade80';g.fillRect(W-108,y-10,Math.max(0,p.en),8)});
 if(S.over>=0){g.fillStyle='#000a';g.fillRect(0,0,W,H);g.fillStyle='#fff';g.textAlign='center';g.font='bold 34px sans-serif';
  g.fillText(S.over==me?'YOU WIN!':'YOU LOSE',W/2,H/2);g.font='16px sans-serif';g.fillText('Tap to play again',W/2,H/2+34)}}
// ---- loop ----
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000||0);last=t;frame++;
 if(mode=='ai'||mode=='host'){inp0=readInput();step(dt);playEv(ev);if(mode=='host')evAll.push(...ev);ev.length=0;
  if(mode=='host'&&frame%2==0&&conn&&conn.open)conn.send(pack())}
 else if(mode=='guest'&&frame%2==0&&conn&&conn.open){const i=readInput();i.x*=-1;i.y*=-1;conn.send({i})}
 draw()}
requestAnimationFrame(loop);
</script></body></html>
