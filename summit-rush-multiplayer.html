<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Summit Dash</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef3f7;--card:#fff;--ink:#1d2b36;--mute:#6b7b88;--cell:#dfe9f0;--cell2:#cddbe6;--acc:#2f7de1;--bad:#fde8e4;--good:#d9f2e4;--wild:#e6e0fa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181f;--card:#1a252e;--ink:#e8eff4;--mute:#8fa1ae;--cell:#22313c;--cell2:#2a3b48;--acc:#5aa0ff;--bad:#4a2a26;--good:#1f4a38;--wild:#3b3463}}
:root[data-theme="dark"]{--bg:#10181f;--card:#1a252e;--ink:#e8eff4;--mute:#8fa1ae;--cell:#22313c;--cell2:#2a3b48;--acc:#5aa0ff;--bad:#4a2a26;--good:#1f4a38;--wild:#3b3463}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:440px;margin:0 auto;padding:12px}
h1{margin:6px 0 2px;font-size:26px;text-align:center}
.sub{text-align:center;color:var(--mute);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 2px 10px #0002;margin-bottom:10px}
input{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid var(--cell2);background:var(--bg);color:var(--ink);margin-bottom:8px}
button{font:inherit;border:0;border-radius:12px;padding:12px 18px;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
button.full{width:100%}button.alt{background:var(--mute)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}
#err{color:#d9534f;min-height:1.2em;margin:6px 0 0;font-size:14px}
.code{font-size:40px;font-weight:800;letter-spacing:6px;text-align:center;color:var(--acc)}
ul{list-style:none;padding:0;margin:8px 0}li{display:flex;align-items:center;gap:8px;padding:4px 0}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:12px;align-items:center;margin-bottom:10px}
#dice{font-size:54px;line-height:1;width:64px;text-align:center;will-change:transform}
#msg{flex:1;font-size:14px;min-height:40px}
#msg b{display:block;font-size:16px}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.chip{background:var(--cell2);border-radius:20px;padding:2px 10px;font-size:13px}
#board{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.c{aspect-ratio:1;border-radius:8px;background:var(--cell);position:relative;display:flex;align-items:center;justify-content:center;font-size:22px}
.c:nth-child(odd){background:var(--cell2)}
.c small{position:absolute;top:2px;left:4px;font-size:10px;color:var(--mute)}
.c.fl{outline:2px solid #f5a524;outline-offset:-2px}
.c.h{background:var(--bad)}.c.g{background:var(--good)}.c.w{background:var(--wild)}
.c.rv span{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(2.4);opacity:0}to{transform:scale(1);opacity:1}}
#field{position:relative}
.tk{position:absolute;left:0;top:0;width:20px;height:20px;z-index:3;pointer-events:none;transition:transform .22s cubic-bezier(.4,0,.2,1);will-change:transform}
.tk.nt{transition:none}
.tk i{display:block;width:100%;height:100%;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 5px #0007;transition:scale .25s,box-shadow .25s}
.tk.on i{scale:1.3;box-shadow:0 0 0 3px #fff8,0 2px 6px #0008}
.c.hit{animation:hit .5s}
@keyframes hit{20%{transform:translateX(-4px) rotate(-4deg)}40%{transform:translateX(4px) rotate(4deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
#start{margin-top:6px;padding:8px;text-align:center;border-radius:8px;background:var(--cell);font-size:13px;color:var(--mute)}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px;margin-top:10px}
.leg div{background:var(--bg);padding:8px;border-radius:10px}
details{font-size:14px;color:var(--mute)}summary{cursor:pointer;padding:4px 0}
.hide{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div class="wrap">
<h1>🏔️ Summit Dash</h1>
<p class="sub">Roll the dice. Reach the peak first. Hurdles stay hidden until someone lands on them!</p>

<div id="home" class="card">
  <input id="name" placeholder="Your name" maxlength="12" autocomplete="off">
  <button class="full" onclick="createRoom()">Create room</button>
  <p class="sub" style="margin:12px 0">or join a friend</p>
  <input id="join" placeholder="Room code" maxlength="4" autocomplete="off">
  <button class="full alt" onclick="joinRoom($('join').value)">Join room</button>
  <p id="err"></p>
</div>

<div id="lobby" class="card hide">
  <div class="code" id="rc"></div>
  <p class="sub" style="margin:0">Share the code or the invite link. 2-4 players.</p>
  <ul id="plist"></ul>
  <div class="row"><button id="copy" class="alt" onclick="copyLink()">Copy invite link</button><button id="go" onclick="startGame()">Start race</button></div>
  <p id="wait" class="sub hide" style="margin:10px 0 0">Waiting for the host to start…</p>
</div>

<div id="game" class="hide">
  <div class="card hud">
    <div id="dice">🎲</div>
    <div id="msg"></div>
    <button id="rollBtn" onclick="roll()">Roll</button>
    <button id="mute" onclick="toggleMute()" aria-label="Toggle sound" style="padding:10px" class="alt">🔊</button>
  </div>
  <div id="chips"></div>
  <div id="field"><div id="board"></div><div id="start"></div></div>
  <div class="card" style="margin-top:10px"><ul id="roster"></ul>
    <details><summary>Hurdle guide</summary><div class="leg" id="leg"></div></details></div>
  <p style="text-align:center"><button class="alt" onclick="location.reload()">Leave game</button></p>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const N=54,COLS=6,ROWS=9,COLORS=['#e5484d','#2f7de1','#2fb36b','#f5a524'];
// k: 0 bad, 1 good, 2 wild
const H={
 rockslide:{e:'🪨',n:'Rockslide',d:'Back 3 tiles',k:0},
 crevasse:{e:'🕳️',n:'Crevasse',d:'Fall to the last flag',k:0},
 iceslide:{e:'🧊',n:'Ice slide',d:'Slide back 4 tiles',k:0},
 thinair:{e:'🌫️',n:'Thin air',d:'Next roll is halved',k:0},
 blizzard:{e:'🌨️',n:'Blizzard',d:'Next roll needs 4+ to move',k:0},
 gust:{e:'💨',n:'Gust',d:'Coin flip: forward 2 or back 2',k:2},
 swap:{e:'🔄',n:'Swap',d:'Trade places with nearest rival',k:2},
 avalanche:{e:'🏔️',n:'Avalanche',d:'Rivals up to 4 behind you slide back 2',k:2},
 hotspring:{e:'♨️',n:'Hot spring',d:'Shield: ignore your next bad hurdle',k:1},
 cablecar:{e:'🚡',n:'Cable car',d:'Ride forward 4 tiles',k:1},
 cache:{e:'🎒',n:'Supply cache',d:'Roll again right away',k:1}
};
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=n=>Math.random()*n|0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Sound (synthesized) ---------- */
let AC,muted=false,windG;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();wind()}if(AC.state==='suspended')AC.resume();return AC}
function toggleMute(){muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(windG)windG.gain.value=muted?0:.04;if(!muted){ac();SFX.turn()}}
function tone(f,t=0,d=.15,type='sine',v=.2,f2){if(muted)return;const a=ac(),o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t;
 o.type=type;o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);
 g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.015);g.gain.exponentialRampToValueAtTime(.0001,s+d);
 o.connect(g).connect(a.destination);o.start(s);o.stop(s+d+.03)}
function noise(t=0,d=.2,v=.2,f=1000,type='lowpass',f2){if(muted)return;const a=ac(),s=a.currentTime+t;
 const b=a.createBuffer(1,Math.ceil(a.sampleRate*d),a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;
 const src=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();src.buffer=b;fl.type=type;fl.frequency.setValueAtTime(f,s);
 if(f2)fl.frequency.exponentialRampToValueAtTime(f2,s+d);
 g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);src.connect(fl).connect(g).connect(a.destination);src.start(s)}
function wind(){const a=AC,b=a.createBuffer(1,a.sampleRate*2,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;
 const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),l=a.createOscillator(),lg=a.createGain();
 s.buffer=b;s.loop=true;f.type='lowpass';f.frequency.value=450;g.gain.value=.04;l.frequency.value=.12;lg.gain.value=240;
 l.connect(lg);lg.connect(f.frequency);s.connect(f);f.connect(g);g.connect(a.destination);s.start();l.start();windG=g}
const SFX={
 rattle(){for(let i=0;i<11;i++)noise(i*.07+i*i*.004,.04,.25,2500+Math.random()*2500,'bandpass')},
 land(){tone(190,0,.14,'triangle',.35,80);noise(0,.06,.2,800)},
 step(i){tone(380+i*45,0,.09,'square',.07);noise(0,.06,.08,2000,'bandpass',700)},
 rockslide(){noise(0,.6,.6,500,'lowpass',80);tone(90,0,.45,'sawtooth',.3,35)},
 crevasse(){tone(520,0,.9,'sine',.28,45);noise(0,.6,.2,900,'lowpass',90)},
 iceslide(){tone(1500,0,.6,'sawtooth',.07,380);noise(0,.6,.14,6000,'bandpass',500)},
 thinair(){tone(200,0,.8,'sine',.18,90);tone(207,0,.8,'sine',.14,93)},
 blizzard(){noise(0,1.1,.35,300,'bandpass',2600);noise(.3,.8,.2,2200,'bandpass',300)},
 gust(){noise(0,.7,.3,400,'bandpass',3200)},
 swap(){tone(500,0,.1,'square',.1,1000);tone(1000,.1,.14,'square',.1,500)},
 avalanche(){noise(0,1.5,.6,800,'lowpass',50);tone(55,0,1.3,'sawtooth',.25,28)},
 hotspring(){[523,659,784].forEach((f,i)=>tone(f,i*.09,.25,'sine',.14));for(let i=0;i<4;i++)tone(400+Math.random()*600,.3+i*.08,.09,'sine',.09,900)},
 cablecar(){tone(300,0,.5,'triangle',.2,900);tone(1568,.4,.5,'sine',.14)},
 cache(){tone(988,0,.08,'square',.1);tone(1319,.08,.3,'square',.1)},
 shield(){tone(700,0,.25,'sine',.15,1100)},
 stuck(){tone(130,0,.3,'square',.18,65)},
 fall(){tone(700,0,.65,'sine',.15,120)},
 six(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.08,.16,'triangle',.22))},
 turn(){tone(660,0,.08,'sine',.14);tone(880,.07,.1,'sine',.14)},
 start(){[392,523,659].forEach((f,i)=>tone(f,i*.12,.4,'triangle',.15))},
 win(){[523,659,784,659,784,1047].forEach((f,i)=>tone(f,i*.13,i===5?.7:.18,'triangle',.28));tone(262,0,1,'sine',.2)}
};
document.addEventListener('pointerdown',()=>ac(),{once:true});

/* ---------- Host: networking & rules ---------- */
let peer,conn,cmap={},me=null,isHost=false,code='';
let T=[],R=[],P=[],turn=0,phase='lobby',winner=null,extra=false,gid=0,seq=0;
const newP=(id,name)=>({id,name:name||'Climber',color:COLORS[P.length],pos:0,need4:false,half:false,shield:false,left:false});
const myName=()=>($('name').value.trim()||'Climber').slice(0,12);

function bc(acts){
 seq++;
 const s={gid,phase,players:P.map(p=>({...p})),tiles:T.map((t,i)=>R[i]?t:null),turn,acts:acts||[],winner,extra,code,seq};
 Object.values(cmap).forEach(c=>c.open&&c.send({t:'s',s}));
 apply(s);
}
function createRoom(){
 ac();isHost=true;me='host';
 const ch='abcdefghjkmnpqrstuvwxyz23456789';code='';for(let i=0;i<4;i++)code+=ch[rnd(ch.length)];
 $('err').textContent='Creating room…';
 peer=new Peer('summitdash-'+code);
 peer.on('open',()=>{P=[newP('host',myName())];$('err').textContent='';bc()});
 peer.on('error',e=>$('err').textContent='Connection problem: '+e.type+'. Try again.');
 peer.on('connection',c=>{c.on('data',d=>onData(c,d));c.on('close',()=>onLeave(c.peer))});
}
function joinRoom(c0){
 ac();c0=(c0||'').trim().toLowerCase();if(c0.length!==4){$('err').textContent='Enter the 4-character room code.';return}
 $('err').textContent='Joining…';peer=new Peer();
 peer.on('open',id=>{
  me=id;conn=peer.connect('summitdash-'+c0,{reliable:true});
  conn.on('open',()=>conn.send({t:'join',name:myName()}));
  conn.on('data',d=>{if(d.t==='s')apply(d.s);else if(d.t==='full'){$('err').textContent='That race has started or is full.';conn.close()}});
  conn.on('close',()=>say('Disconnected','The host left the game.'));
 });
 peer.on('error',e=>$('err').textContent=e.type==='peer-unavailable'?'No room with that code.':'Connection problem: '+e.type);
}
function onData(c,d){
 if(d.t==='join'){
  if(phase!=='lobby'||P.length>=4){c.send({t:'full'});return}
  cmap[c.peer]=c;P.push(newP(c.peer,String(d.name).slice(0,12)));bc();
 }else if(d.t==='roll'&&phase==='play'&&P[turn].id===c.peer)doRoll();
}
function onLeave(id){
 delete cmap[id];const i=P.findIndex(p=>p.id===id);if(i<0)return;
 if(phase==='lobby'){P.splice(i,1);P.forEach((p,j)=>p.color=COLORS[j]);bc();return}
 P[i].left=true;const alive=P.filter(p=>!p.left);
 if(phase==='play'){
  if(alive.length<2){phase='end';winner=alive[0]?alive[0].id:null;bc();return}
  if(turn===i){extra=false;nextTurn()}
  bc();
 }
}
function startGame(){
 const keys=Object.keys(H),picks=keys.concat(Array.from({length:7},()=>keys[rnd(keys.length)]));
 const sh=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
 sh(picks);const spots=sh(Array.from({length:50},(_,i)=>i+3).filter(x=>x%10));
 T=Array(N+1).fill(null);R=Array(N+1).fill(false);picks.forEach((h,i)=>T[spots[i]]=h);
 P.forEach(p=>Object.assign(p,{pos:0,need4:false,half:false,shield:false}));
 gid++;turn=0;phase='play';winner=null;extra=false;
 bc([{k:'start'},{k:'say',a:P[0].name+' rolls first',b:'Race to the summit!'}]);
}
function nextTurn(){let n=0;do{turn=(turn+1)%P.length;n++}while(P[turn].left&&n<8)}
function doRoll(){
 if(phase!=='play')return;
 const i=turn,p=P[i],A=[],d=1+rnd(6);let n=d;extra=false;
 A.push({k:'dice',v:d,i},{k:'say',a:p.name+' rolled '+d,b:'Climbing…'});
 if(p.need4){p.need4=false;if(n<4){n=0;A.push({k:'fx',f:'stuck'},{k:'say',a:'🌨️ Blizzard!',b:'Needed 4+. '+p.name+' is stuck'})}}
 if(n&&p.half){p.half=false;n=Math.max(1,Math.ceil(n/2));A.push({k:'say',a:'🌫️ Thin air',b:'Roll halved to '+n})}
 let hit=false;
 if(n){const from=p.pos;n=Math.min(n,N-p.pos);p.pos+=n;A.push({k:'move',i,from,to:p.pos});hit=land(p,i,A,0)}
 if(p.pos>=N){phase='end';winner=p.id;A.push({k:'win',i})}
 else{if(d===6&&n&&!hit)extra=true;if(!extra)nextTurn()}
 bc(A);
}
function land(p,i,A,dep){
 const pos=p.pos,t=T[pos];if(!t||pos>=N)return false;
 R[pos]=true;const h=H[t];A.push({k:'reveal',pos,h:t});
 if(h.k===0&&p.shield){p.shield=false;A.push({k:'fx',f:'shield'},{k:'say',a:'♨️ Shield blocked '+h.n,b:p.name+' is safe'});return true}
 A.push({k:'say',a:h.e+' '+h.n+'!',b:h.d},{k:'hurdle',h:t,pos});
 const o=P.map((q,j)=>j).filter(j=>j!==i&&!P[j].left);
 const jump=(j,to)=>{P[j].pos=to;A.push({k:'jump',i:j,to})};
 switch(t){
  case 'rockslide':jump(i,Math.max(0,pos-3));break;
  case 'crevasse':jump(i,Math.floor((pos-1)/10)*10);break;
  case 'iceslide':jump(i,Math.max(0,pos-4));break;
  case 'thinair':p.half=true;break;
  case 'blizzard':p.need4=true;break;
  case 'gust':{const f=Math.random()<.5?2:-2;jump(i,Math.max(0,Math.min(N-1,pos+f)));if(f>0&&dep<2)land(p,i,A,dep+1);break}
  case 'swap':{if(o.length){o.sort((a,b)=>Math.abs(P[a].pos-pos)-Math.abs(P[b].pos-pos));const j=o[0],q=P[j].pos;jump(j,pos);jump(i,q)}break}
  case 'avalanche':o.forEach(j=>{if(P[j].pos<pos&&P[j].pos>=pos-4)jump(j,Math.max(0,P[j].pos-2))});break;
  case 'hotspring':p.shield=true;break;
  case 'cablecar':jump(i,Math.min(N,pos+4));if(dep<2)land(p,i,A,dep+1);break;
  case 'cache':extra=true;break;
 }
 return true;
}

/* ---------- Client: display & animation ---------- */
let L=[],REV={},S=null,curGid=-1,ti=0,animating=false,queue=Promise.resolve(),curColor='#2f7de1';
function show(id){['home','lobby','game'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function apply(s){queue=queue.then(()=>play(s)).catch(e=>console.error(e))}
function say(a,b=''){$('msg').innerHTML=`<b style="color:${curColor}">${esc(a)}</b>${esc(b)}`}
async function play(s){
 if(s.phase==='lobby'){S=s;show('lobby');$('rc').textContent=s.code.toUpperCase();
  $('plist').innerHTML=s.players.map(p=>`<li><span class="dot" style="background:${p.color}"></span>${esc(p.name)}${p.id===me?' (you)':''}</li>`).join('');
  $('go').classList.toggle('hide',!isHost);$('copy').classList.toggle('hide',!isHost);$('go').disabled=s.players.length<2;$('wait').classList.toggle('hide',isHost);return}
 if(s.gid!==curGid)build(s);
 show('game');animating=true;ui();
 for(const a of s.acts)await act(a);
 sync(s);animating=false;ui();
 if(s.phase==='play'&&s.players[s.turn].id===me)SFX.turn();
}
function build(s){
 curGid=s.gid;REV={};let b='';
 for(let dr=0;dr<ROWS;dr++){const r=ROWS-1-dr;
  for(let c=0;c<COLS;c++){const p=r*COLS+(r%2?COLS-1-c:c)+1;
   b+=`<div class="c ${p%10===0&&p<N?'fl':''}" id="c${p}"><small>${p}</small><span>${p===N?'🏁':p%10===0?'🚩':''}</span></div>`}}
 $('board').innerHTML=b;$('start').textContent='START';
 document.querySelectorAll('.tk').forEach(t=>t.remove());
 L=s.players.map(p=>{const t=document.createElement('div');t.className='tk nt';t.innerHTML=`<i style="background:${p.color}"></i>`;$('field').appendChild(t);return{id:p.id,name:p.name,color:p.color,pos:0,el:t}});
 $('leg').innerHTML=Object.values(H).map(h=>`<div>${h.e} <b>${h.n}</b><br>${h.d}</div>`).join('')+'<div>🚩 <b>Flags</b><br>Crevasse drops you here</div>';
 ti=s.turn;layout();window.scrollTo({top:document.body.scrollHeight});
 requestAnimationFrame(()=>requestAnimationFrame(()=>L.forEach(p=>p.el.classList.remove('nt'))));
}
function drawCell(i){const h=REV[i],c=$('c'+i);if(!h)return;c.className='c '+['h','g','w'][H[h].k]+' rv';c.innerHTML=`<small>${i}</small><span>${H[h].e}</span>`}
function sync(s){
 L.forEach((p,i)=>{p.pos=s.players[i].pos;p.left=s.players[i].left});
 s.tiles.forEach((h,i)=>{if(h&&!REV[i]){REV[i]=h;drawCell(i)}});
 ti=s.turn;S=s;layout();
 const cur=s.players[s.turn];curColor=cur.color;
 if(s.phase==='end'){const w=s.players.find(p=>p.id===s.winner);curColor=w?w.color:curColor;say(w?'🏆 '+w.name+(w.id===me?' (you) win!':' wins!'):'Race over','First to the summit!')}
 else if(s.extra)say(cur.name+' goes again!','Roll again!');
 else say(cur.name+(cur.id===me?', your turn':"'s turn"),cur.id===me?'Tap Roll!':'Waiting…');
 $('roster').innerHTML=s.players.map(p=>`<li><span class="dot" style="background:${p.color}"></span><span style="flex:1">${esc(p.name)}${p.id===me?' (you)':''}${p.left?' · left':''}</span><b>${p.pos}/${N}</b></li>`).join('');
}
function ui(){
 const s=S;if(!s||s.phase==='lobby')return;const cur=s.players[s.turn],b=$('rollBtn');
 if(s.phase==='end'){b.textContent=isHost?'Play again':'Race over';b.disabled=!isHost||animating}
 else{b.textContent=cur.id===me?'Roll':'Wait…';b.disabled=cur.id!==me||animating}
 const m=s.players.find(p=>p.id===me),c=[];
 if(m){if(m.shield)c.push('♨️ Shield ready');if(m.half)c.push('🌫️ Next roll halved');if(m.need4)c.push('🌨️ Need 4+ to move')}
 $('chips').innerHTML=c.map(x=>`<span class="chip">${x}</span>`).join('');
}
function layout(){
 L.forEach((p,i)=>{
  const cell=p.pos===0?$('start'):$('c'+p.pos);
  const mates=L.filter(q=>q.pos===p.pos),k=mates.indexOf(p),m=mates.length,gap=p.pos===0?30:13;
  const x=cell.offsetLeft+cell.offsetWidth/2+(k-(m-1)/2)*gap-10;
  const y=cell.offsetTop+cell.offsetHeight*(p.pos===0?.5:.62)-10;
  p.el.style.transform=`translate(${x}px,${y}px)`;p.el.classList.toggle('on',i===ti);p.el.style.zIndex=i===ti?4:3;
 });
}
addEventListener('resize',()=>{if(L.length){L.forEach(p=>p.el.classList.add('nt'));layout();requestAnimationFrame(()=>L.forEach(p=>p.el.classList.remove('nt')))}});
function hop(p){p.el.firstChild.animate([{transform:'translateY(0) scale(1)'},{transform:'translateY(-12px) scale(1.15)'},{transform:'translateY(0) scale(1)'}],{duration:220,easing:'ease-in-out'})}
function follow(p){const r=p.el.getBoundingClientRect();if(r.top<170||r.bottom>innerHeight-70)window.scrollBy({top:r.top-innerHeight*.5,behavior:'smooth'})}
async function rollAnim(n){
 const f='⚀⚁⚂⚃⚄⚅',d=$('dice');SFX.rattle();
 const spin=d.animate([{transform:'rotate(0) scale(1)'},{transform:'rotate(360deg) scale(1.35)',offset:.4},{transform:'rotate(720deg) scale(1.1)',offset:.8},{transform:'rotate(900deg) scale(1)'}],{duration:850,easing:'cubic-bezier(.2,.7,.3,1)'});
 let w=45;while(w<200){d.textContent=f[rnd(6)];await sleep(w);w*=1.25}
 d.textContent=f[n-1];SFX.land();await spin.finished.catch(()=>{});
 d.animate([{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:200,easing:'ease-out'});
}
async function act(a){
 if(a.k==='say')say(a.a,a.b);
 else if(a.k==='start'){SFX.start()}
 else if(a.k==='dice'){curColor=L[a.i].color;await rollAnim(a.v);await sleep(200)}
 else if(a.k==='move'){const p=L[a.i];for(let q=a.from+1;q<=a.to;q++){p.pos=q;layout();hop(p);SFX.step(q-a.from-1);follow(p);await sleep(220)}}
 else if(a.k==='reveal'){REV[a.pos]=a.h;drawCell(a.pos)}
 else if(a.k==='hurdle'){const c=$('c'+a.pos);c.classList.add('hit');SFX[a.h]();await sleep(850);c.classList.remove('hit')}
 else if(a.k==='fx'){SFX[a.f]();await sleep(350)}
 else if(a.k==='jump'){const p=L[a.i];if(a.to<p.pos)SFX.fall();p.el.style.transitionDuration='650ms';p.pos=a.to;layout();follow(p);await sleep(720);p.el.style.transitionDuration=''}
 else if(a.k==='win'){const p=L[a.i];SFX.win();p.el.firstChild.animate([{scale:1},{scale:1.9},{scale:1.3}],{duration:700,easing:'ease-out',fill:'forwards'});await sleep(700)}
}
function roll(){
 ac();if(!S||animating)return;
 if(S.phase==='end'){if(isHost)startGame();return}
 if(isHost){if(P[turn].id==='host')doRoll()}else if(conn&&conn.open)conn.send({t:'roll'});
}
function copyLink(){const u=location.origin+location.pathname+'?room='+code,b=$('copy');
 (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>b.textContent='Copied!',()=>prompt('Copy this link',u));setTimeout(()=>b.textContent='Copy invite link',1500)}
const qr=new URLSearchParams(location.search).get('room');if(qr)$('join').value=qr.slice(0,4);
</script></body></html>
